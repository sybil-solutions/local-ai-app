# On a Mac: the integration test, which there also covers the Apple silicon path (a pinned host recipe starts in its
# own venv, answers through the app's port, is counted, survives an app restart and is gone after Stop), and the
# end-to-end test of the desktop app. macOS minutes cost ten times Linux ones on a private repo, so this runs only
# when the server, the desktop shell, the tests or this file change.
name: macOS
on:
  push:
    branches: [main]
    paths: ['server/**', 'electron/**', 'tests/**', 'package.json', '.github/workflows/macos.yml']
  pull_request:
    paths: ['server/**', 'electron/**', 'tests/**', 'package.json', '.github/workflows/macos.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: The real server against stand-in engines, with a host run
        run: node tests/integration.mjs
      - run: npm ci # with its install scripts: Electron fetches its program in one
      - name: The real desktop app, driven through its window
        run: node tests/e2e.mjs
