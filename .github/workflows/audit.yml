# Known vulnerabilities in what the app is built with. Weekly, and whenever the lockfile changes.
# Fails on high or critical; the app itself has no runtime npm dependencies, so findings are in Electron or the build tools.
name: Audit
on:
  schedule:
    - cron: '17 6 * * 1'
  pull_request:
    paths: ['package.json', 'package-lock.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm audit --audit-level=high
