# The Apple silicon path: a pinned host recipe starts in its own venv, answers through the app's port, is counted,
# survives an app restart and is gone after Stop. macOS minutes cost ten times Linux ones on a private repo, so this
# runs only when the server, the smoke test or this file changes.
name: Smoke (macOS)
on:
  push:
    branches: [main]
    paths: ['server/**', 'scripts/**', 'package.json', '.github/workflows/smoke-macos.yml']
  pull_request:
    paths: ['server/**', 'scripts/**', 'package.json', '.github/workflows/smoke-macos.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smoke-macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke-macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: node scripts/smoke.mjs
