-align: left;\"><\/td>\n<td style=\"text-align: left;\"><\/td>\n<td style=\"text-align: left;\"><\/td>\n<td style=\"text-align: left;\"><\/td>\n<td style=\"text-align: left;\"><\/td>\n<td style=\"text-align: left;\"><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">CoVoST<\/td>\n<td style=\"text-align: left;\">-<\/td>\n<td style=\"text-align: left;\">-<\/td>\n<td style=\"text-align: left;\">38.5<sup>*<\/sup><\/td>\n<td style=\"text-align: left;\">35.54<\/td>\n<td style=\"text-align: left;\">33.47<\/td>\n<td style=\"text-align: left;\">-<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">FLEURS (lower is better)<\/td>\n<td style=\"text-align: left;\">-<\/td>\n<td style=\"text-align: left;\">-<\/td>\n<td style=\"text-align: left;\">0.069<sup>*<\/sup><\/td>\n<td style=\"text-align: left;\">0.08<\/td>\n<td style=\"text-align: left;\">0.09<\/td>\n<td style=\"text-align: left;\">-<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Long Context<\/strong><\/td>\n<td style=\"text-align: left;\"><\/td>\n<td style=\"text-align: left;\"><\/td>\n<td style=\"text-align: left;\"><\/td>\n<td style=\"text-align: left;\"><\/td>\n<td style=\"text-align: left;\"><\/td>\n<td style=\"text-align: left;\"><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">MRCR v2 8 needle 128k (average)<\/td>\n<td style=\"text-align: left;\">66.4%<\/td>\n<td style=\"text-align: left;\">44.1%<\/td>\n<td style=\"text-align: left;\">43.4%<\/td>\n<td style=\"text-align: left;\">25.4%<\/td>\n<td style=\"text-align: left;\">19.1%<\/td>\n<td style=\"text-align: left;\">13.5%<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><sup>*<\/sup>Excluding Chinese language.<\/p>\n<h2><strong>Core Capabilities<\/strong><\/h2>\n<p>Gemma 4 models handle a broad range of tasks across text, vision, and audio. Key capabilities include:<\/p>\n<ul>\n<li><strong>Thinking<\/strong> \u2013 Built-in reasoning mode that lets the model think step-by-step before answering.<\/li>\n<li><strong>Long Context<\/strong> \u2013 Context windows of up to 128K tokens (E2B/E4B) and 256K tokens (12B, 26B A4B/31B).<\/li>\n<li><strong>Image Understanding<\/strong> \u2013 Object detection, Document/PDF parsing, screen and UI understanding, chart comprehension, OCR (including multilingual), handwriting recognition, and pointing. Images can be processed at variable aspect ratios and resolutions.<\/li>\n<li><strong>Video Understanding<\/strong> \u2013 Analyze video by processing sequences of frames.<\/li>\n<li><strong>Interleaved Multimodal Input<\/strong> \u2013 Freely mix text and<\/li>\n<\/ul>"}, "Gemma 4 26B A4B": {"repo": "google/gemma-4-26b-a4b-it", "about": "Google's Gemma 4 mixture-of-experts model: 26B total, 4B active, so it runs fast while seeing images and thinking.", "likes": 1750, "downloads": 5506751, "license": "apache-2.0", "updated": "2026-07-20", "html": "<div align=\"center\">\n  <img src=https://ai.google.dev/gemma/images/gemma4_banner.png>\n<\/div>\n\n<p align=\"center\">\n    <a target=\"_blank\" rel=\"noopener\" href=\"https://huggingface.co/collections/google/gemma-4\" target=\"_blank\">Hugging Face<\/a> |\n    <a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/google-gemma\" target=\"_blank\">GitHub<\/a> |\n    <a target=\"_blank\" rel=\"noopener\" href=\"https://blog.google/innovation-and-ai/technology/developers-tools/gemma-4/\" target=\"_blank\">Launch Blog<\/a> |\n    <a target=\"_blank\" rel=\"noopener\" href=\"https://ai.google.dev/gemma/docs/core\" target=\"_blank\">Documentation<\/a> |\n    <a target=\"_blank\" rel=\"noopener\" href=\"https://arxiv.org/abs/2607.02770\" target=\"_blank\">Technical Report<\/a>\n    <br>\n    <b>License<\/b>: <a target=\"_blank\" rel=\"noopener\" href=\"https://ai.google.dev/gemma/docs/gemma_4_license\" target=\"_blank\">Apache 2.0<\/a> | <b>Authors<\/b>: <a target=\"_blank\" rel=\"noopener\" href=\"https://deepmind.google/models/gemma/\" target=\"_blank\">Google DeepMind<\/a>\n<\/p>\n\n<p>Gemma is a family of open models built by Google DeepMind. Gemma 4 models are multimodal, handling text and image input (with audio supported on E2B, E4B, and 12B) and generating text output. This release includes open-weights models in both pre-trained and instruction-tuned variants. Gemma 4 features a context window of up to 256K tokens and maintains multilingual support in over 140 languages. <\/p>\n<p>Featuring both Dense and Mixture-of-Experts (MoE) architectures, Gemma 4 is well-suited for tasks like text generation, coding, and reasoning. The models are available in five distinct sizes: <strong>E2B<\/strong>, <strong>E4B<\/strong>, <strong>12B<\/strong>, <strong>26B A4B<\/strong>, and <strong>31B<\/strong>. Their diverse sizes make them deployable in environments ranging from high-end phones to laptops and servers, democratizing access to state-of-the-art AI.<\/p>\n<p>Gemma 4 introduces key <strong>capability and architectural advancements<\/strong>:<\/p>\n<ul>\n<li>\n<p><strong>Reasoning<\/strong> \u2013 All models in the family are designed as highly capable reasoners, with configurable thinking modes.<\/p>\n<\/li>\n<li>\n<p><strong>Extended Multimodalities<\/strong> \u2013 Processes Text, Image with variable aspect ratio and resolution support (all models), Video, and Audio (featured natively on the E2B, E4B, and 12B models).<\/p>\n<\/li>\n<li>\n<p><strong>Diverse &amp; Efficient Architectures<\/strong> \u2013 Offers Dense and Mixture-of-Experts (MoE) variants of different sizes for scalable deployment.<\/p>\n<\/li>\n<li>\n<p><strong>Optimized for On-Device<\/strong> \u2013 Smaller models are specifically designed for efficient local execution on laptops and mobile devices.<\/p>\n<\/li>\n<li>\n<p><strong>Increased Context Window<\/strong> \u2013 The small models feature a 128K context window, while the medium models support 256K.<\/p>\n<\/li>\n<li>\n<p><strong>Enhanced Coding &amp; Agentic Capabilities<\/strong> \u2013 Achieves notable improvements in coding benchmarks alongside native function-calling support, powering highly capable autonomous agents.<\/p>\n<\/li>\n<li>\n<p><strong>Native System Prompt Support<\/strong> \u2013 Gemma 4 introduces native support for the <code>system<\/code> role, enabling more structured and controllable conversations.<\/p>\n<\/li>\n<\/ul>\n<h2><strong>Models Overview<\/strong><\/h2>\n<p>Gemma 4 models are designed to deliver frontier-level performance at each size, targeting deployment scenarios from mobile and edge devices (E2B, E4B) to consumer GPUs and workstations (12B, 26B A4B, 31B). They are well-suited for reasoning, agentic workflows, coding, and multimodal understanding.<\/p>\n<p>The models employ a hybrid attention mechanism that interleaves local sliding window attention with full global attention, ensuring the final layer is always global. This hybrid design delivers the processing speed and low memory footprint of a lightweight model without sacrificing the deep awareness required for complex, long-context tasks. To optimize memory for long contexts, global layers feature unified Keys and Values, and apply Proportional RoPE (p-RoPE). <\/p>\n<h3>Dense Models<\/h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Property<\/th>\n<th style=\"text-align: left;\">E2B<\/th>\n<th style=\"text-align: left;\">E4B<\/th>\n<th style=\"text-align: left;\">12B Unified<\/th>\n<th style=\"text-align: left;\">31B Dense<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>Total Parameters<\/strong><\/td>\n<td style=\"text-align: left;\">2.3B effective <br> (5.1B with embeddings)<\/td>\n<td style=\"text-align: left;\">4.5B effective <br> (8B with embeddings)<\/td>\n<td style=\"text-align: left;\">11.95B<\/td>\n<td style=\"text-align: left;\">30.7B<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Layers<\/strong><\/td>\n<td style=\"text-align: left;\">35<\/td>\n<td style=\"text-align: left;\">42<\/td>\n<td style=\"text-align: left;\">48<\/td>\n<td style=\"text-align: left;\">60<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Sliding Window<\/strong><\/td>\n<td style=\"text-align: left;\">512 tokens<\/td>\n<td style=\"text-align: left;\">512 tokens<\/td>\n<td style=\"text-align: left;\">1024 tokens<\/td>\n<td style=\"text-align: left;\">1024 tokens<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Context Length<\/strong><\/td>\n<td style=\"text-align: left;\">128K tokens<\/td>\n<td style=\"text-align: left;\">128K tokens<\/td>\n<td style=\"text-align: left;\">256K tokens<\/td>\n<td style=\"text-align: left;\">256K tokens<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Vocabulary Size<\/strong><\/td>\n<td style=\"text-align: left;\">262K<\/td>\n<td style=\"text-align: left;\">262K<\/td>\n<td style=\"text-align: left;\">262K<\/td>\n<td style=\"text-align: left;\">262K<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Supported Modalities<\/strong><\/td>\n<td style=\"text-align: left;\">Text, Image, Audio<\/td>\n<td style=\"text-align: left;\">Text, Image, Audio<\/td>\n<td style=\"text-align: left;\">Text, Image, Audio<\/td>\n<td style=\"text-align: left;\">Text, Image<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Vision Encoder Parameters<\/strong><\/td>\n<td style=\"text-align: left;\"><em>~150M<\/em><\/td>\n<td style=\"text-align: left;\"><em>~150M<\/em><\/td>\n<td style=\"text-align: left;\">-<\/td>\n<td style=\"text-align: left;\"><em>~550M<\/em><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Audio Encoder Parameters<\/strong><\/td>\n<td style=\"text-align: left;\"><em>~300M<\/em><\/td>\n<td style=\"text-align: left;\"><em>~300M<\/em><\/td>\n<td style=\"text-align: left;\">-<\/td>\n<td style=\"text-align: left;\">No Audio<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The \"E\" in E2B and E4B stands for \"effective\" parameters. The smaller models incorporate Per-Layer Embeddings (PLE) to maximize parameter efficiency in on-device deployments. Rather than adding more layers or parameters to the model, PLE gives each decoder layer its own small embedding for every token. These embedding tables are large but are only used for quick lookups, which is why the effective parameter count is much smaller than the total.<\/p>\n<p>The \"Unified\" in Gemma 4 12B Unified refers to its encoder-free architecture. Other Gemma 4 models use dedicated encoders to process multimodal data before passing it to the LLM. Gemma 4 12B eliminates these encoders entirely, projecting raw image patches and audio waveforms directly into the LLM's embedding space through lightweight linear layers. This unified approach means all modalities flow straight into a single decoder-only transformer, reducing multimodal latency and allowing the entire model to be fine-tuned in one pass.<\/p>\n<h3>Mixture-of-Experts (MoE) Model<\/h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Property<\/th>\n<th style=\"text-align: left;\">26B A4B MoE<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>Total Parameters<\/strong><\/td>\n<td style=\"text-align: left;\">25.2B<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Active Parameters<\/strong><\/td>\n<td style=\"text-align: left;\">3.8B<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Layers<\/strong><\/td>\n<td style=\"text-align: left;\">30<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Sliding Window<\/strong><\/td>\n<td style=\"text-align: left;\">1024 tokens<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Context Length<\/strong><\/td>\n<td style=\"text-align: left;\">256K tokens<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Vocabulary Size<\/strong><\/td>\n<td style=\"text-align: left;\">262K<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Expert Count<\/strong><\/td>\n<td style=\"text-align: left;\">8 active / 128 total and 1 shared<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Supported Modalities<\/strong><\/td>\n<td style=\"text-align: left;\">Text, Image<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Vision Encoder Parameters<\/strong><\/td>\n<td style=\"text-align: left;\"><em>~550M<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The \"A\" in 26B A4B stands for \"active parameters\" in contrast to the total number of parameters the model contains. By only activating a 4B subset of parameters during inference, the Mixture-of-Experts model runs much faster than its 26B total might suggest. This makes it an excellent choice for fast inference compared to the dense 31B model since it runs almost as fast as a 4B-parameter model.<\/p>\n<h2><strong>Benchmark Results<\/strong><\/h2>\n<p>These models were evaluated against a large collection of different datasets and metrics to cover different aspects of text generation. Evaluation results marked in the table are for instruction-tuned models.<\/p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\"><\/th>\n<th style=\"text-align: left;\">Gemma 4  31B<\/th>\n<th style=\"text-align: left;\">Gemma 4  26B A4B<\/th>\n<th style=\"text-align: left;\">Gemma 4 12B Unified<\/th>\n<th style=\"text-align: left;\">Gemma 4  E4B<\/th>\n<th style=\"text-align: left;\">Gemma 4  E2B<\/th>\n<th style=\"text-align: left;\">Gemma 3  27B (no think)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">MMLU Pro<\/td>\n<td style=\"text-align: left;\">85.2%<\/td>\n<td style=\"text-align: left;\">82.6%<\/td>\n<td style=\"text-align: left;\">77.2%<\/td>\n<td style=\"text-align: left;\">69.4%<\/td>\n<td style=\"text-align: left;\">60.0%<\/td>\n<td style=\"text-align: left;\">67.6%<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">AIME 2026 no tools<\/td>\n<td style=\"text-align: left;\">89.2%<\/td>\n<td style=\"text-align: left;\">88.3%<\/td>\n<td style=\"text-align: left;\">77.5%<\/td>\n<td style=\"text-align: left;\">42.5%<\/td>\n<td style=\"text-align: left;\">37.5%<\/td>\n<td style=\"text-align: left;\">20.8%<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">LiveCodeBench v6<\/td>\n<td style=\"text-align: left;\">80.0%<\/td>\n<td style=\"text-align: left;\">77.1%<\/td>\n<td style=\"text-align: left;\">72.0%<\/td>\n<td style=\"text-align: left;\">52.0%<\/td>\n<td style=\"text-align: left;\">44.0%<\/td>\n<td style=\"text-align: left;\">29.1%<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Codeforces ELO<\/td>\n<td style=\"text-align: left;\">2150<\/td>\n<td style=\"text-align: left;\">1718<\/td>\n<td style=\"text-align: left;\">1659<\/td>\n<td style=\"text-align: left;\">940<\/td>\n<td style=\"text-align: left;\">633<\/td>\n<td style=\"text-align: left;\">110<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">GPQA Diamond<\/td>\n<td style=\"text-align: left;\">84.3%<\/td>\n<td style=\"text-align: left;\">82.3%<\/td>\n<td style=\"text-align: left;\">78.8%<\/td>\n<td style=\"text-align: left;\">58.6%<\/td>\n<td style=\"text-align: left;\">43.4%<\/td>\n<td style=\"text-align: left;\">42.4%<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Tau2 (average over 3)<\/td>\n<td style=\"text-align: left;\">76.9%<\/td>\n<td style=\"text-align: left;\">68.2%<\/td>\n<td style=\"text-align: left;\">69.0%<\/td>\n<td style=\"text-align: left;\">42.2%<\/td>\n<td style=\"text-align: left;\">24.5%<\/td>\n<td style=\"text-align: left;\">16.2%<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">HLE no tools<\/td>\n<td style=\"text-align: left;\">19.5%<\/td>\n<td style=\"text-align: left;\">8.7%<\/td>\n<td style=\"text-align: left;\">5.2%<\/td>\n<td style=\"text-align: left;\">-<\/td>\n<td style=\"text-align: left;\">-<\/td>\n<td style=\"text-align: left;\">-<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">HLE with search<\/td>\n<td style=\"text-align: left;\">26.5%<\/td>\n<td style=\"text-align: left;\">17.2%<\/td>\n<td style=\"text-align: left;\">-<\/td>\n<td style=\"text-align: left;\">-<\/td>\n<td style=\"text-align: left;\">-<\/td>\n<td style=\"text-align: left;\">-<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">BigBench Extra Hard<\/td>\n<td style=\"text-align: left;\">74.4%<\/td>\n<td style=\"text-align: left;\">64.8%<\/td>\n<td style=\"text-align: left;\">53.0%<\/td>\n<td style=\"text-align: left;\">33.1%<\/td>\n<td style=\"text-align: left;\">21.9%<\/td>\n<td style=\"text-align: left;\">19.3%<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">MMMLU<\/td>\n<td style=\"text-align: left;\">88.4%<\/td>\n<td style=\"text-align: left;\">86.3%<\/td>\n<td style=\"text-align: left;\">83.4%<\/td>\n<td style=\"text-align: left;\">76.6%<\/td>\n<td style=\"text-align: left;\">67.4%<\/td>\n<td style=\"text-align: left;\">70.7%<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Vision<\/strong><\/td>\n<td style=\"text-align: left;\"><\/td>\n<td style=\"text-align: left;\"><\/td>\n<td style=\"text-align: left;\"><\/td>\n<td style=\"text-align: left;\"><\/td>\n<td style=\"text-align: left;\"><\/td>\n<td style=\"text-align: left;\"><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">MMMU Pro<\/td>\n<td style=\"text-align: left;\">76.9%<\/td>\n<td style=\"text-align: left;\">73.8%<\/td>\n<td style=\"text-align: left;\">69.1%<\/td>\n<td style=\"text-align: left;\">52.6%<\/td>\n<td style=\"text-align: left;\">44.2%<\/td>\n<td style=\"text-align: left;\">49.7%<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">OmniDocBench 1.5 (average edit distance, lower is better)<\/td>\n<td style=\"text-align: left;\">0.131<\/td>\n<td style=\"text-align: left;\">0.149<\/td>\n<td style=\"text-align: left;\">0.164<\/td>\n<td style=\"text-align: left;\">0.181<\/td>\n<td style=\"text-align: left;\">0.290<\/td>\n<td style=\"text-align: left;\">0.365<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">MATH-Vision<\/td>\n<td style=\"text-align: left;\">85.6%<\/td>\n<td style=\"text-align: left;\">82.4%<\/td>\n<td style=\"text-align: left;\">79.7%<\/td>\n<td style=\"text-align: left;\">59.5%<\/td>\n<td style=\"text-align: left;\">52.4%<\/td>\n<td style=\"text-align: left;\">46.0%<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">MedXPertQA MM<\/td>\n<td style=\"text-align: left;\">61.3%<\/td>\n<td style=\"text-align: left;\">58.1%<\/td>\n<td style=\"text-align: left;\">48.7%<\/td>\n<td style=\"text-align: left;\">28.7%<\/td>\n<td style=\"text-align: left;\">23.5%<\/td>\n<td style=\"text-align: left;\">-<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Audio<\/strong><\/td>\n<td style=\"text-align: left;\"><\/td>\n<td style=\"text-align: left;\"><\/td>\n<td style=\"text-align: left;\"><\/td>\n<td style=\"text-align: left;\"><\/td>\n<td style=\"text-align: left;\"><\/td>\n<td style=\"text-align: left;\"><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">CoVoST<\/td>\n<td style=\"text-align: left;\">-<\/td>\n<td style=\"text-align: left;\">-<\/td>\n<td style=\"text-align: left;\">38.5<sup>*<\/sup><\/td>\n<td style=\"text-align: left;\">35.54<\/td>\n<td style=\"text-align: left;\">33.47<\/td>\n<td style=\"text-align: left;\">-<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">FLEURS (lower is better)<\/td>\n<td style=\"text-align: left;\">-<\/td>\n<td style=\"text-align: left;\">-<\/td>\n<td style=\"text-align: left;\">0.069<sup>*<\/sup><\/td>\n<td style=\"text-align: left;\">0.08<\/td>\n<td style=\"text-align: left;\">0.09<\/td>\n<td style=\"text-align: left;\">-<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Long Context<\/strong><\/td>\n<td style=\"text-align: left;\"><\/td>\n<td style=\"text-align: left;\"><\/td>\n<td style=\"text-align: left;\"><\/td>\n<td style=\"text-align: left;\"><\/td>\n<td style=\"text-align: left;\"><\/td>\n<td style=\"text-align: left;\"><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">MRCR v2 8 needle 128k (average)<\/td>\n<td style=\"text-align: left;\">66.4%<\/td>\n<td style=\"text-align: left;\">44.1%<\/td>\n<td style=\"text-align: left;\">43.4%<\/td>\n<td style=\"text-align: left;\">25.4%<\/td>\n<td style=\"text-align: left;\">19.1%<\/td>\n<td style=\"text-align: left;\">13.5%<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><sup>*<\/sup>Excluding Chinese language.<\/p>\n<h2><strong>Core Capabilities<\/strong><\/h2>\n<p>Gemma 4 models handle a broad range of tasks across text, vision, and audio. Key capabilities include:<\/p>\n<ul>\n<li><strong>Thinking<\/strong> \u2013 Built-in reasoning mode that lets the model think step-by-step before answering.<\/li>\n<li><strong>Long Context<\/strong> \u2013 Context windows of up to 128K tokens (E2B/E4B) and 256K tokens (12B, 26B A4B/31B).<\/li>\n<li><strong>Image Understanding<\/strong> \u2013 Object detection, Document/PDF parsing, screen and UI understanding, chart comprehension, OCR (including multilingual), handwriting recognition, and pointing. Images can be processed at variable aspect ratios and resolutions.<\/li>\n<li><strong>Video Understanding<\/strong> \u2013 Analyze video by processing sequences of frames.<\/li>\n<li><strong>Interleaved Multimodal Input<\/strong> \u2013 Freely mix text and images in any order within a single prompt.<\/li>\n<li><strong>Function Calling<\/strong> \u2013 Native support for structured tool use, enabling agentic workflows.<\/li>\n<li><strong>Coding<\/strong> \u2013 Code generation, completion, and correction.<\/li>\n<li><strong>Multilingual<\/strong> \u2013 Out-of-the-box support for 35+ languages, pre-trained on 140+ languages.<\/li>\n<li><strong>Audio<\/strong> (E2B, E4B, and 12B only) \u2013 Automatic speech recognition (ASR) and speech-to-translated-text translation across multiple languages.<\/li>\n<\/ul>\n<h2>Getting Started<\/h2>\n<p>You can use all Gemma 4 models with the latest version of Transformers. <\/p>"}, "Granite 4.2 30B": {"repo": "ibm-granite/granite-4.2-30b", "about": "IBM's 30B dense model (64 layers). It thinks before it answers and calls tools.", "likes": 140, "downloads": 36840, "license": "apache-2.0", "updated": "2026-09-04", "html": "<h1>Granite-4.2-30B<\/h1>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://huggingface.co/collections/ibm-granite/granite-42-language-models\"><img alt=\"Collection\" src=\"https://img.shields.io/badge/Granite_4.2-Collection-3B82F6?style=flat-square\" /><\/a>\n<a target=\"_blank\" rel=\"noopener\" href=\"https://huggingface.co/blog/ibm-granite/granite-4-2\"><img alt=\"Blog\" src=\"https://img.shields.io/badge/Technical-Blog-10B981?style=flat-square\" /><\/a>\n<a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/ibm-granite/granite-4.2-language-models\"><img alt=\"GitHub\" src=\"https://img.shields.io/badge/GitHub-Repository-181717?style=flat-square&amp;logo=github\" /><\/a>\n<a target=\"_blank\" rel=\"noopener\" href=\"https://www.apache.org/licenses/LICENSE-2.0\"><img alt=\"License\" src=\"https://img.shields.io/badge/License-Apache_2.0-EAB308?style=flat-square\" /><\/a><\/p>\n<hr />\n<h2>Model Summary<\/h2>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Developers<\/strong><\/td>\n<td>Granite Team, IBM<\/td>\n<\/tr>\n<tr>\n<td><strong>Model Type<\/strong><\/td>\n<td>Decoder-only Dense Transformer (Reasoning)<\/td>\n<\/tr>\n<tr>\n<td><strong>Architecture<\/strong><\/td>\n<td>GraniteForCausalLM<\/td>\n<\/tr>\n<tr>\n<td><strong>Base Model<\/strong><\/td>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://huggingface.co/ibm-granite/granite-4.1-30b-base\">Granite-4.1-30B-Base<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>Parameters<\/strong><\/td>\n<td>30B<\/td>\n<\/tr>\n<tr>\n<td><strong>Context Length<\/strong><\/td>\n<td>Natively Supports 128K (Long-context extension to 512K)<\/td>\n<\/tr>\n<tr>\n<td><strong>Precision<\/strong><\/td>\n<td>bfloat16<\/td>\n<\/tr>\n<tr>\n<td><strong>Tested Languages<\/strong><\/td>\n<td>English, German, Spanish, French, Japanese, Portuguese, Arabic, Czech, Italian, Korean, Dutch, Chinese (other languages may work but have not been fully tested)<\/td>\n<\/tr>\n<tr>\n<td><strong>Reasoning Mode<\/strong><\/td>\n<td>Built-in <code>&lt;think&gt;...&lt;/think&gt;<\/code> chain-of-thought<\/td>\n<\/tr>\n<tr>\n<td><strong>Best For<\/strong><\/td>\n<td>Reasoning, Code Generation, Tool Calling, Agentic Workflows, Multilingual Dialog<\/td>\n<\/tr>\n<tr>\n<td><strong>License<\/strong><\/td>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://www.apache.org/licenses/LICENSE-2.0\">Apache 2.0<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>HF Collection<\/strong><\/td>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://huggingface.co/collections/ibm-granite/granite-42-language-models\">Granite 4.2 Language Models<\/a><\/td>\n<\/tr>\n<tr>\n<td><strong>Release Date<\/strong><\/td>\n<td>August 25, 2026<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Model Overview<\/h2>\n<h3>What is IBM Granite?<\/h3>\n<p>Granite is a family of open-source large language models developed by IBM, designed for enterprise and research use. Granite models are built to be versatile, safe, and efficient \u2014 covering a range of sizes and capabilities from compact edge-deployable models to large-scale reasoning systems. All Granite models are released under the Apache 2.0 license, enabling unrestricted commercial and academic use.<\/p>\n<p>The Granite 4.2 generation introduces native reasoning (thinking) capabilities, allowing models to perform step-by-step chain-of-thought reasoning before producing final answers. This significantly improves performance on complex math, coding, multi-step logic, and agentic tool-calling tasks.<\/p>\n<h3>Description<\/h3>\n<p><strong>Granite-4.2-30B<\/strong> is the flagship reasoning model in the Granite 4.2 family. It delivers the strongest performance across reasoning-intensive tasks by leveraging built-in <code>&lt;think&gt;...&lt;/think&gt;<\/code> chain-of-thought. It supports flexible thinking modes \u2014 full thinking (default), non-thinking, and low-effort \u2014 allowing users to balance depth vs. latency on a per-query basis.<\/p>\n<p>Key capabilities:\n- <strong>Built-in Reasoning:<\/strong> Native chain-of-thought that significantly improves performance on math, coding, and complex multi-step problems.\n- <strong>Flexible Thinking Modes:<\/strong> Seamlessly switch between full thinking, non-thinking, and low-effort modes within a single model.\n- <strong>Reasoning-Augmented Tool Calling:<\/strong> The model reasons about which tools to invoke and why, producing more accurate function calls.\n- <strong>512K Context Window:<\/strong> Supports long documents, multi-turn conversations, and complex agentic workflows.\n- <strong>Apache 2.0 Licensed:<\/strong> Fully open for commercial and research use.<\/p>\n<hr />\n<h2>Model Design<\/h2>\n<p>Granite-4.2-30B is built on a decoder-only dense transformer architecture with the following core components:<\/p>\n<ul>\n<li><strong>Attention:<\/strong> Grouped Query Attention (GQA) with 32 attention heads and 8 KV heads<\/li>\n<li><strong>Position Embedding:<\/strong> Rotary Position Embedding (RoPE) with \u03b8 = 10,000,000<\/li>\n<li><strong>Feed-Forward:<\/strong> MLP with SwiGLU activation (hidden size 32768)<\/li>\n<li><strong>Normalization:<\/strong> RMSNorm (\u03b5 = 1e-5)<\/li>\n<li><strong>Embeddings:<\/strong> Separate input/output embeddings (not tied)<\/li>\n<li><strong>Precision:<\/strong> bfloat16<\/li>\n<\/ul>\n<table>\n<thead>\n  <tr>\n    <th style=\"text-align:left; background-color: #001d6c; color: white;\">Component<\/th>\n    <th style=\"text-align:center; background-color: #001d6c; color: white;\">3B Dense<\/th>\n    <th style=\"text-align:center; background-color: #001d6c; color: white;\">8B Dense<\/th>\n    <th style=\"text-align:center; background-color: #001d6c; color: white;\">30B Dense<\/th>\n  <\/tr><\/thead>\n<tbody>\n  <tr>\n    <td style=\"text-align:left;\">Embedding size<\/td>\n    <td style=\"text-align:center;\">2560<\/td>\n    <td style=\"text-align:center;\">4096<\/td>\n    <td style=\"text-align:center; background-color: #DAE8FF;\">4096<\/td>\n  <\/tr>\n  <tr>\n    <td style=\"text-align:left;\">Number of layers<\/td>\n    <td style=\"text-align:center;\">40<\/td>\n    <td style=\"text-align:center;\">40<\/td>\n    <td style=\"text-align:center; background-color: #DAE8FF;\">64<\/td>\n  <\/tr>\n  <tr>\n    <td style=\"text-align:left;\">Attention head size<\/td>\n    <td style=\"text-align:center;\">64<\/td>\n    <td style=\"text-align:center;\">128<\/td>\n    <td style=\"text-align:center; background-color: #DAE8FF;\">128<\/td>\n  <\/tr>\n  <tr>\n    <td style=\"text-align:left;\">Number of attention heads<\/td>\n    <td style=\"text-align:center;\">40<\/td>\n    <td style=\"text-align:center;\">32<\/td>\n    <td style=\"text-align:center; background-color: #DAE8FF;\">32<\/td>\n  <\/tr>\n  <tr>\n    <td style=\"text-align:left;\">Number of KV heads<\/td>\n    <td style=\"text-align:center;\">8<\/td>\n    <td style=\"text-align:center;\">8<\/td>\n    <td style=\"text-align:center; background-color: #DAE8FF;\">8<\/td>\n  <\/tr>\n  <tr>\n    <td style=\"text-align:left;\">MLP hidden size<\/td>\n    <td style=\"text-align:center;\">8192<\/td>\n    <td style=\"text-align:center;\">12800<\/td>\n    <td style=\"text-align:center; background-color: #DAE8FF;\">32768<\/td>\n  <\/tr>\n  <tr>\n    <td style=\"text-align:left;\">MLP activation<\/td>\n    <td style=\"text-align:center;\">SwiGLU<\/td>\n    <td style=\"text-align:center;\">SwiGLU<\/td>\n    <td style=\"text-align:center; background-color: #DAE8FF;\">SwiGLU<\/td>\n  <\/tr>\n  <tr>\n    <td style=\"text-align:left;\">Sequence length<\/td>\n    <td style=\"text-align:center;\">131072<\/td>\n    <td style=\"text-align:center;\">131072<\/td>\n    <td style=\"text-align:center; background-color: #DAE8FF;\">131072<\/td>\n  <\/tr>\n  <tr>\n    <td style=\"text-align:left;\">Position embedding<\/td>\n    <td style=\"text-align:center;\">RoPE<\/td>\n    <td style=\"text-align:center;\">RoPE<\/td>\n    <td style=\"text-align:center; background-color: #DAE8FF;\">RoPE<\/td>\n  <\/tr>\n  <tr>\n    <td style=\"text-align:left;\"># Parameters<\/td>\n    <td style=\"text-align:center;\">3B<\/td>\n    <td style=\"text-align:center;\">8B<\/td>\n    <td style=\"text-align:center; background-color: #DAE8FF;\">30B<\/td>\n  <\/tr>\n<\/tbody><\/table>\n\n<hr />\n<h2>Training Methodology<\/h2>\n<p>Granite-4.2-30B is post-trained from <a target=\"_blank\" rel=\"noopener\" href=\"https://huggingface.co/ibm-granite/granite-4.1-30b-base\">Granite-4.1-30B-Base<\/a> through a rigorous multi-stage pipeline that progressively unlocks reasoning, tool use, and instruction-following capabilities. A full listing of training datasets is available in the <a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/ibm-granite/granite-4.2-language-models\">Granite 4.2 GitHub repository<\/a>. The training pipeline consists of three stages:<\/p>\n<h3>Stage 1: Pre-Training<\/h3>\n<!-- TODO: Add pre-training details here -->\n\n<p>Granite-4.2-30B builds on <a target=\"_blank\" rel=\"noopener\" href=\"https://huggingface.co/ibm-granite/granite-4.1-30b-base\">Granite-4.1-30B-Base<\/a>, which was pre-trained on a large-scale English as well as multilingual corpus. For full pre-training details (data composition, training recipe, and infrastructure), refer to our <a target=\"_blank\" rel=\"noopener\" href=\"https://huggingface.co/blog/ibm-granite/granite-4-1\">Granite 4.1 Technical Blog<\/a>.<\/p>\n<h3>Stage 2: Supervised Fine-Tuning<\/h3>\n<!-- TODO: Add SFT details here -->\n\n<p>The SFT stage draws on instruction-following, chain-of-thought, and reasoning data to cultivate the model's reasoning and thinking abilities. For all the three, 3B, 8B and 30B models, the training corpus comprises four sources: (1) publicly available datasets under permissive licenses, (2) internally generated synthetic data targeting reasoning, tool calling, and chain-of-thought capabilities, (3) agentic traces collected across a diverse range of tasks, and (4) a curated selection of human-authored data. Hyperparameters were tuned before training was scaled to all three model sizes. For the 30B model, we conducted a second SFT phase, in which the agentic data was up-sampled while a smaller share of general replay data was retained. This phase trained for a single epoch, starting from a lower learning rate than Phase 1.<\/p>\n<!--...Please mention details on multi-phase SFT if necessary... This should be brief we will have more detailed version in technical blog. -->\n\n<h3>Stage 3: Reinforcement Learning<\/h3>\n<!-- TODO: Add RL details here -->\n\n<p>The final stage of training applies multi-phase, multi-environment reinforcement learning using Group Relative Policy Optimization (GRPO). Training spans a broad mix of environments including math, code, science, instruction following, tool use, general chat and structured output. Most environments provide verifiable rewards, while open-ended <\/p>"}, "LFM2.5-2.6B": {"repo": "LiquidAI/LFM2.5-2.6B", "about": "Liquid AI's 2.6B hybrid model: tiny and fast, built for on-device work.", "likes": 860, "downloads": 49905, "license": "other", "updated": "2026-11-03", "html": "<div align=\"center\">\n  <img \n    src=\"https://cdn-uploads.huggingface.co/production/uploads/61b8e2ba285851687028d395/2b08LKpev0DNEk6DlnWkY.png\" \n    alt=\"Liquid AI\" \n    style=\"width: 100%; max-width: 100%; height: auto; display: inline-block; margin-bottom: 0.5em; margin-top: 0.5em;\"\n  />\n  <div style=\"display: flex; justify-content: center; gap: 0.5em; margin-bottom: 1em;\">\n    <a target=\"_blank\" rel=\"noopener\" href=\"https://playground.liquid.ai/\"><strong>Try LFM<\/strong><\/a> \u2022 \n    <a target=\"_blank\" rel=\"noopener\" href=\"https://docs.liquid.ai/lfm/getting-started/welcome\"><strong>Docs<\/strong><\/a> \u2022 \n    <a target=\"_blank\" rel=\"noopener\" href=\"https://discord.com/invite/liquid-ai\"><strong>Discord<\/strong><\/a>\n  <\/div>\n<\/div>\n\n<h1>LFM2.5-2.6B<\/h1>\n<p>LFM2.5-2.6B is part of LFM2.5, a family of hybrid models designed for <strong>on-device deployment<\/strong>. It builds on the LFM2 architecture with a 128K context window and agentic post-training.<\/p>\n<ul>\n<li><strong>Best-in-class agent<\/strong>: Competitive with models 4x larger on tool use, instruction following, and multi-step agentic tasks.<\/li>\n<li><strong>Agentic reinforcement learning<\/strong>: Trained inside the most popular agentic harnesses to improve compatibility.<\/li>\n<li><strong>Efficient inference<\/strong>: 220 tok/s on an Apple M5 Max and 113 tok/s on an AMD Ryzen CPU, in under 2.5 GB of memory.<\/li>\n<\/ul>\n<p>Find more information about LFM2.5-2.6B in our <a target=\"_blank\" rel=\"noopener\" href=\"https://www.liquid.ai/blog/lfm2-5-2-6b\">blog post<\/a>.<\/p>\n<p><img alt=\"\" src=\"https://cdn-uploads.huggingface.co/production/uploads/644249b08443bce4c9890a0f/NAfUL2725b6KDUGf1KOd9.png\" /><\/p>\n<blockquote>\n<p>[!NOTE]\n\ud83d\udcbb <strong>Demos<\/strong>: Try LFM2.5-2.6B's agentic capabilities in a Hugging Face space without any setup:\n<strong><a target=\"_blank\" rel=\"noopener\" href=\"https://huggingface.co/spaces/LiquidAI/LFM2.5-2.6B-WebGPU\">Research Agent in your browser<\/a><\/strong>: helps you research a specific question and generates a summary<\/p>\n<\/blockquote>\n<h2>\ud83d\uddd2\ufe0f Model Details<\/h2>\n<table>\n<thead>\n<tr>\n<th>Model<\/th>\n<th>Parameters<\/th>\n<th>Description<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://huggingface.co/LiquidAI/LFM2.5-2.6B-Base\">LFM2.5-2.6B-Base<\/a><\/td>\n<td>2.6B<\/td>\n<td>Pre-trained base model for fine-tuning<\/td>\n<\/tr>\n<tr>\n<td><strong><a target=\"_blank\" rel=\"noopener\" href=\"https://huggingface.co/LiquidAI/LFM2.5-2.6B\">LFM2.5-2.6B<\/a><\/strong><\/td>\n<td>2.6B<\/td>\n<td>Post-trained for agentic workloads<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>LFM2.5-2.6B is a general-purpose text-only model with the following features:<\/p>\n<ul>\n<li><strong>Total parameters<\/strong>: 2.69B<\/li>\n<li><strong>Number of layers<\/strong>: 30 (22 double-gated short convolution blocks + 8 GQA)<\/li>\n<li><strong>Training budget<\/strong>: 34 trillion tokens<\/li>\n<li><strong>Vocabulary size<\/strong>: 128,000<\/li>\n<li><strong>Context length<\/strong>: 131,072 tokens<\/li>\n<li><strong>Languages<\/strong>: English, Arabic, Chinese, French, German, Italian, Japanese, Korean, Portuguese, Spanish, Vietnamese, Thai, Indonesian, Hindi, Russian, Polish <\/li>\n<li><strong>Generation parameters<\/strong>:<\/li>\n<li><code>temperature: 0.1<\/code><\/li>\n<li><code>top_k: 50<\/code><\/li>\n<li><code>repetition_penalty: 1.1<\/code><\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>Model<\/th>\n<th>Description<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong><a target=\"_blank\" rel=\"noopener\" href=\"https://huggingface.co/LiquidAI/LFM2.5-2.6B\">LFM2.5-2.6B<\/a><\/strong><\/td>\n<td>Original model checkpoint in native format. Best for fine-tuning or inference with Transformers, vLLM, and SGLang.<\/td>\n<\/tr>\n<tr>\n<td><strong><a target=\"_blank\" rel=\"noopener\" href=\"https://huggingface.co/LiquidAI/LFM2.5-2.6B-GGUF\">LFM2.5-2.6B-GGUF<\/a><\/strong><\/td>\n<td>Quantized format for llama.cpp and compatible tools. Optimized for CPU inference and local deployment with reduced memory usage.<\/td>\n<\/tr>\n<tr>\n<td><strong><a target=\"_blank\" rel=\"noopener\" href=\"https://huggingface.co/LiquidAI/LFM2.5-2.6B-ONNX\">LFM2.5-2.6B-ONNX<\/a><\/strong><\/td>\n<td>ONNX Runtime format for cross-platform deployment. Enables hardware-accelerated inference across diverse environments (cloud, edge, mobile).<\/td>\n<\/tr>\n<tr>\n<td><strong><a target=\"_blank\" rel=\"noopener\" href=\"https://huggingface.co/LiquidAI/LFM2.5-2.6B-MLX\">LFM2.5-2.6B-MLX<\/a><\/strong><\/td>\n<td>MLX format for Apple Silicon. Optimized for fast inference on Mac devices using the MLX framework.<\/td>\n<\/tr>\n<tr>\n<td><strong><a target=\"_blank\" rel=\"noopener\" href=\"https://huggingface.co/LiquidAI/LFM2.5-2.6B-DSpark\">LFM2.5-2.6B-DSpark<\/a><\/strong><\/td>\n<td>Speculative decoding drafter (328M). Pair it with this model for ~2.6x faster decoding with identical outputs.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>We recommend using it for agentic workloads, tool use, data extraction, RAG, and long-context workflows. It is not recommended for agentic coding and knowledge-heavy tasks.<\/p>\n<h3>Chat Template<\/h3>\n<p>LFM2.5 uses a ChatML-like format. See the <a target=\"_blank\" rel=\"noopener\" href=\"https://docs.liquid.ai/lfm/key-concepts/chat-template\">Chat Template documentation<\/a> for details. Example:<\/p>\n<pre><code>&lt;|startoftext|&gt;&lt;|im_start|&gt;system\nYou are a helpful assistant trained by Liquid AI.&lt;|im_end|&gt;\n&lt;|im_start|&gt;user\nWhat is C. elegans?&lt;|im_end|&gt;\n&lt;|im_start|&gt;assistant\n<\/code><\/pre>\n<p>You can use <a target=\"_blank\" rel=\"noopener\" href=\"https://huggingface.co/docs/transformers/en/chat_templating#using-applychattemplate\"><code>tokenizer.apply_chat_template()<\/code><\/a> to format your messages automatically.<\/p>\n<blockquote>\n<p>[!TIP]\n\ud83d\udca1 <strong>Note<\/strong>: LFM2.5-2.6B is a pure reasoning model that always thinks before it answers. It adds a <code>&lt;think&gt;<\/code> tag directly in the <a target=\"_blank\" rel=\"noopener\" href=\"https://huggingface.co/LiquidAI/LFM2.5-2.6B/blob/main/chat_template.jinja#L124\">chat template<\/a> when starting an assistant answer.<\/p>\n<\/blockquote>\n<h3>Tool Use<\/h3>\n<p>LFM2.5 supports function calling in four steps:<\/p>\n<ol>\n<li><strong>Function definition<\/strong>: Provide the list of tools as a JSON object in the system prompt, or use <a target=\"_blank\" rel=\"noopener\" href=\"https://huggingface.co/docs/transformers/en/chat_extras#passing-tools\"><code>tokenizer.apply_chat_template()<\/code><\/a> with <code>tools=...<\/code>.<\/li>\n<li><strong>Function call<\/strong>: By default, LFM2.5 writes Pythonic function calls (a Python list between <code>&lt;|tool_call_start|&gt;<\/code> and <code>&lt;|tool_call_end|&gt;<\/code> special tokens), as the assistant answer. You can override this behavior by asking the model to output JSON function calls in the system prompt.<\/li>\n<li><strong>Function execution<\/strong>: Execute the call and return the result with the <code>tool<\/code> role.<\/li>\n<li><strong>Final answer<\/strong>: LFM2.5 interprets the tool output and returns a plain-text answer addressing the original prompt.<\/li>\n<\/ol>\n<p>See the <a target=\"_blank\" rel=\"noopener\" href=\"https://docs.liquid.ai/lfm/key-concepts/tool-use\">Tool Use documentation<\/a> for the full guide. Example:<\/p>\n<pre><code>&lt;|startoftext|&gt;&lt;|im_start|&gt;system\nList of tools: [{&quot;name&quot;: &quot;get_candidate_status&quot;, &quot;description&quot;: &quot;Retrieves the current status of a candidate in the recruitment process&quot;, &quot;parameters&quot;: {&quot;type&quot;: &quot;object&quot;, &quot;properties&quot;: {&quot;candidate_id&quot;: {&quot;type&quot;: &quot;string&quot;, &quot;description&quot;: &quot;Unique identifier for the candidate&quot;}}, &quot;required&quot;: [&quot;candidate_id&quot;]}}]&lt;|im_end|&gt;\n&lt;|im_start|&gt;user\nWhat is the current status of candidate ID 12345?&lt;|im_end|&gt;\n&lt;|im_start|&gt;assistant\n&lt;|tool_call_start|&gt;[get_candidate_status(candidate_id=&quot;12345&quot;)]&lt;|tool_call_end|&gt;Checking the current status of candidate ID 12345.&lt;|im_end|&gt;\n&lt;|im_start|&gt;tool\n[{&quot;candidate_id&quot;: &quot;12345&quot;, &quot;status&quot;: &quot;Interview Scheduled&quot;, &quot;position&quot;: &quot;Clinical Research Associate&quot;, &quot;date&quot;: &quot;2023-11-20&quot;}]&lt;|im_end|&gt;\n&lt;|im_start|&gt;assistant\nThe candidate with ID 12345 is currently in the &quot;Interview Scheduled&quot; stage for the position of Clinical Research Associate, with an interview date set for 2023-11-20.&lt;|im_end|&gt;\n<\/code><\/pre>\n<h3>Training<\/h3>\n<p>LFM2.5-2.6B is pre-trained on ~34T tokens, with a mid-training phase that extends the context window to 128K. Post-training then turns the base model into an agent in four stages: supervised fine-tuning (two rounds), per-domain teacher specialization, multi-domain on-policy distillation, and agentic reinforcement learning.<\/p>\n<p><img alt=\"\" src=\"https://cdn-uploads.huggingface.co/production/uploads/61b8e2ba285851687028d395/hCmGKgTRihAR9NfJlCVNN.png\" /><\/p>\n<p>In particular, agentic reinforcement learning allows us to directly train the model inside popular agentic harnesses. It exposes the model to their tools, system prompts, and interaction patterns, helping it work reliably across agent environments.<\/p>\n<p><img alt=\"\" src=\"https://cdn-uploads.huggingface.co/production/uploads/61b8e2ba285851687028d395/LXqTXbw-lh0Yru5UWLMCq.png\" /><\/p>\n<h2>\ud83c\udfc3 Inference<\/h2>\n<p>LFM2.5 is supported by many inference frameworks. See the <a target=\"_blank\" rel=\"noopener\" href=\"https://docs.liquid.ai/lfm/inference/transformers\">Inference documentation<\/a> for the full list.<\/p>\n<table>\n<thead>\n<tr>\n<th>Name<\/th>\n<th>Description<\/th>\n<th>Docs<\/th>\n<th style=\"text-align: center;\">Notebook<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/huggingface/transformers\">Transformers<\/a><\/td>\n<td>Simple inference with direct access to model internals.<\/td>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://docs.liquid.ai/lfm/inference/transformers\">Link<\/a><\/td>\n<td style=\"text-align: center;\"><a target=\"_blank\" rel=\"noopener\" href=\"https://colab.research.google.com/drive/1_q3jQ6LtyiuPzFZv7Vw8xSfPU5FwkKZY?usp=sharing\"><img src=\"https://cdn-uploads.huggingface.co/production/uploads/61b8e2ba285851687028d395/vlOyMEjwHa_b_LXysEu2E.png\" width=\"110\" alt=\"Colab link\"><\/a><\/td>\n<\/tr>\n<tr>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/vllm-project/vllm\">vLLM<\/a><\/td>\n<td>High-throughput production deployments with GPU.<\/td>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://docs.liquid.ai/lfm/inference/vllm\">Link<\/a><\/td>\n<td style=\"text-align: center;\"><a target=\"_blank\" rel=\"noopener\" href=\"https://colab.research.google.com/drive/1VfyscuHP8A3we_YpnzuabYJzr5ju0Mit?usp=sharing\">&lt;img src=\"https://cdn-uploads.huggingface.co/production/uploads/61b8e2ba285851687028d395/vlOyMEjwHa_b_L<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, "LFM2.5-24B": {"repo": "LiquidAI/LFM2.5-24B-A2B", "about": "Liquid AI's 24B hybrid mixture-of-experts (about 2B active; 30 short-convolution and 10 attention layers, 64 experts). It reasons before it answers and calls tools.", "likes": 607, "downloads": 38878, "license": "other", "updated": "2026-11-03", "html": "<div align=\"center\">\n  <img \n    src=\"https://cdn-uploads.huggingface.co/production/uploads/61b8e2ba285851687028d395/2b08LKpev0DNEk6DlnWkY.png\" \n    alt=\"Liquid AI\" \n    style=\"width: 100%; max-width: 100%; height: auto; display: inline-block; margin-bottom: 0.5em; margin-top: 0.5em;\"\n  />\n  <div style=\"display: flex; justify-content: center; gap: 0.5em; margin-bottom: 1em;\">\n    <a target=\"_blank\" rel=\"noopener\" href=\"https://playground.liquid.ai/\"><strong>Try LFM<\/strong><\/a> \u2022 \n    <a target=\"_blank\" rel=\"noopener\" href=\"https://docs.liquid.ai/lfm/getting-started/welcome\"><strong>Docs<\/strong><\/a> \u2022 \n    <a target=\"_blank\" rel=\"noopener\" href=\"https://discord.com/invite/liquid-ai\"><strong>Discord<\/strong><\/a>\n  <\/div>\n<\/div>\n\n<h1>LFM2.5-24B-A2B<\/h1>\n<p>LFM2.5-24B-A2B is a 24B-parameter reasoning model with only 2B active parameters, built for <strong>fast, private agents on-device<\/strong>. It is the largest and final model in the LFM2.5 family, which now spans two orders of magnitude: from <a target=\"_blank\" rel=\"noopener\" href=\"https://huggingface.co/LiquidAI/LFM2.5-230M\">LFM2.5-230M<\/a> to LFM2.5-24B-A2B.<\/p>\n<ul>\n<li><strong>Best-in-class agent<\/strong>: Competitive with Qwen3.6-35B-A3B, a model with ~50% more total and active parameters, on agentic and tool-use tasks, scoring 48.09 on LiveClaw versus 38.19.<\/li>\n<li><strong>Reasoning at MoE speed<\/strong>: Always thinks before it answers. With only 2B active parameters per token, each reasoning token is cheap.<\/li>\n<li><strong>Efficient inference<\/strong>: Runs up to 1.7\u00d7 faster than comparable MoEs on-device, with 184 tok/s on an Apple M5 Max and up to 21K output tok/s on a single NVIDIA B300 GPU.<\/li>\n<\/ul>\n<p>Find more information about LFM2.5-24B-A2B in our <a target=\"_blank\" rel=\"noopener\" href=\"https://www.liquid.ai/blog/lfm2-5-24b-a2b\">blog post<\/a>.<\/p>\n<p><img alt=\"LFM2.5-24B-A2B benchmarks\" src=\"https://huggingface.co/LiquidAI/LFM2.5-24B-A2B/resolve/main/figures/LFM2.5-24B-A2B-benchmark.png\" /><\/p>\n<h2>\ud83d\uddd2\ufe0f Model Details<\/h2>\n<table>\n<thead>\n<tr>\n<th>Model<\/th>\n<th>Parameters<\/th>\n<th>Description<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><a target=\"_blank\" rel=\"noopener\" href=\"https://huggingface.co/LiquidAI/LFM2.5-24B-A2B-Base\">LFM2.5-24B-A2B-Base<\/a><\/td>\n<td>24B (2B active)<\/td>\n<td>Pre-trained base model for fine-tuning<\/td>\n<\/tr>\n<tr>\n<td><strong><a target=\"_blank\" rel=\"noopener\" href=\"https://huggingface.co/LiquidAI/LFM2.5-24B-A2B\">LFM2.5-24B-A2B<\/a><\/strong><\/td>\n<td>24B (2B active)<\/td>\n<td>Post-trained for agentic workloads<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>LFM2.5-24B-A2B is a general-purpose text-only reasoning model with the following features:<\/p>\n<ul>\n<li><strong>Total parameters<\/strong>: 24.0B<\/li>\n<li><strong>Active parameters<\/strong>: 2.45B<\/li>\n<li><strong>Number of layers<\/strong>: 40 (30 double-gated short convolution blocks + 10 GQA)<\/li>\n<li><strong>Experts<\/strong>: 64 per MoE block, top-4 routing<\/li>\n<li><strong>Training budget<\/strong>: 36 trillion tokens<\/li>\n<li><strong>Vocabulary size<\/strong>: 128,000<\/li>\n<li><strong>Context length<\/strong>: 131,072 tokens<\/li>\n<li><strong>Languages<\/strong>: English, Arabic, Chinese, French, German, Italian, Japanese, Korean, Portuguese, Spanish, Vietnamese, Thai, Indonesian, Hindi, Russian, Polish<\/li>\n<li><strong>Generation parameters<\/strong>:<\/li>\n<li><code>temperature: 0.1<\/code><\/li>\n<li><code>top_k: 50<\/code><\/li>\n<li><code>repetition_penalty: 1.05<\/code><\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>Model<\/th>\n<th>Description<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong><a target=\"_blank\" rel=\"noopener\" href=\"https://huggingface.co/LiquidAI/LFM2.5-24B-A2B\">LFM2.5-24B-A2B<\/a><\/strong><\/td>\n<td>Original model checkpoint in native format. Best for fine-tuning or inference with Transformers, vLLM, and SGLang.<\/td>\n<\/tr>\n<tr>\n<td><strong><a target=\"_blank\" rel=\"noopener\" href=\"https://huggingface.co/LiquidAI/LFM2.5-24B-A2B-FP8\">LFM2.5-24B-A2B-FP8<\/a><\/strong><\/td>\n<td>FP8 checkpoint (block-wise FP8 weights, dynamic FP8 activations). Best for high-throughput GPU serving with vLLM and SGLang with lower memory usage.<\/td>\n<\/tr>\n<tr>\n<td><strong><a target=\"_blank\" rel=\"noopener\" href=\"https://huggingface.co/LiquidAI/LFM2.5-24B-A2B-GGUF\">LFM2.5-24B-A2B-GGUF<\/a><\/strong><\/td>\n<td>Quantized format for llama.cpp and compatible tools. Optimized for CPU inference and local deployment with reduced memory usage.<\/td>\n<\/tr>\n<tr>\n<td><strong><a target=\"_blank\" rel=\"noopener\" href=\"https://huggingface.co/LiquidAI/LFM2.5-24B-A2B-ONNX\">LFM2.5-24B-A2B-ONNX<\/a><\/strong><\/td>\n<td>ONNX Runtime format for cross-platform deployment. Enables hardware-accelerated inference across diverse environments (cloud, edge, mobile).<\/td>\n<\/tr>\n<tr>\n<td><strong><a target=\"_blank\" rel=\"noopener\" href=\"https://huggingface.co/LiquidAI/LFM2.5-24B-A2B-MLX-4bit\">LFM2.5-24B-A2B-MLX-4bit<\/a><\/strong><\/td>\n<td>MLX format for Apple Silicon. Optimized for fast inference on Mac devices using the MLX framework.<\/td>\n<\/tr>\n<tr>\n<td><strong><a target=\"_blank\" rel=\"noopener\" href=\"https://huggingface.co/LiquidAI/LFM2.5-24B-A2B-DSpark\">LFM2.5-24B-A2B-DSpark<\/a><\/strong><\/td>\n<td>DSpark draft model for speculative decoding with SGLang, for faster generation. <em>Coming soon.<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>We recommend using it for agents that need to reason, call tools, and run reliably on your device. It is not recommended for knowledge-heavy tasks on its own: pair it with retrieval or web search, which plays to its tool-calling strength.<\/p>\n<h3>Chat Template<\/h3>\n<p>LFM2.5 uses a ChatML-like format. See the <a target=\"_blank\" rel=\"noopener\" href=\"https://docs.liquid.ai/lfm/key-concepts/chat-template\">Chat Template documentation<\/a> for details. Example:<\/p>\n<pre><code>&lt;|startoftext|&gt;&lt;|im_start|&gt;system\nYou are a helpful assistant trained by Liquid AI.&lt;|im_end|&gt;\n&lt;|im_start|&gt;user\nWhat is C. elegans?&lt;|im_end|&gt;\n&lt;|im_start|&gt;assistant\n&lt;think&gt;\n<\/code><\/pre>\n<p>You can use <a target=\"_blank\" rel=\"noopener\" href=\"https://huggingface.co/docs/transformers/en/chat_templating#using-applychattemplate\"><code>tokenizer.apply_chat_template()<\/code><\/a> to format your messages automatically.<\/p>\n<blockquote>\n<p>[!TIP]\n\ud83d\udca1 <strong>Note<\/strong>: Unlike LFM2-24B-A2B, LFM2.5-24B-A2B is a pure reasoning model that always thinks before it answers. It adds a <code>&lt;think&gt;<\/code> tag directly in the <a target=\"_blank\" rel=\"noopener\" href=\"https://huggingface.co/LiquidAI/LFM2.5-24B-A2B/blob/main/chat_template.jinja#L124\">chat template<\/a> when starting an assistant answer.<\/p>\n<\/blockquote>\n<h3>Tool Use<\/h3>\n<p>LFM2.5 supports function calling in four steps:<\/p>\n<ol>\n<li><strong>Function definition<\/strong>: Provide the list of tools as a JSON object in the system prompt, or use <a target=\"_blank\" rel=\"noopener\" href=\"https://huggingface.co/docs/transformers/en/chat_extras#passing-tools\"><code>tokenizer.apply_chat_template()<\/code><\/a> with <code>tools=...<\/code>.<\/li>\n<li><strong>Function call<\/strong>: By default, LFM2.5 writes Pythonic function calls (a Python list between <code>&lt;|tool_call_start|&gt;<\/code> and <code>&lt;|tool_call_end|&gt;<\/code> special tokens), as the assistant answer. You can override this behavior by asking the model to output JSON function calls in the system prompt.<\/li>\n<li><strong>Function execution<\/strong>: Execute the call and return the result with the <code>tool<\/code> role.<\/li>\n<li><strong>Final answer<\/strong>: LFM2.5 interprets the tool output and returns a plain-text answer addressing the original prompt.<\/li>\n<\/ol>\n<p>See the <a target=\"_blank\" rel=\"noopener\" href=\"https://docs.liquid.ai/lfm/key-concepts/tool-use\">Tool Use documentation<\/a> for the full guide. Example:<\/p>\n<pre><code>&lt;|startoftext|&gt;&lt;|im_start|&gt;system\nList of tools: [{&quot;name&quot;: &quot;get_candidate_status&quot;, &quot;description&quot;: &quot;Retrieves the current status of a candidate in the recruitment process&quot;, &quot;parameters&quot;: {&quot;type&quot;: &quot;object&quot;, &quot;properties&quot;: {&quot;candidate_id&quot;: {&quot;type&quot;: &quot;string&quot;, &quot;description&quot;: &quot;Unique identifier for the candidate&quot;}}, &quot;required&quot;: [&quot;candidate_id&quot;]}}]&lt;|im_end|&gt;\n&lt;|im_start|&gt;user\nWhat is the current status of candidate ID 12345?&lt;|im_end|&gt;\n&lt;|im_start|&gt;assistant\n&lt;|tool_call_start|&gt;[get_candidate_status(candidate_id=&quot;12345&quot;)]&lt;|tool_call_end|&gt;Checking the current status of candidate ID 12345.&lt;|im_end|&gt;\n&lt;|im_start|&gt;tool\n[{&quot;candidate_id&quot;: &quot;12345&quot;, &quot;status&quot;: &quot;Interview Scheduled&quot;, &quot;position&quot;: &quot;Clinical Research Associate&quot;, &quot;date&quot;: &quot;2023-11-20&quot;}]&lt;|im_end|&gt;\n&lt;|im_start|&gt;assistant\nThe candidate with ID 12345 is currently in the &quot;Interview Scheduled&quot; stage for the position of Clinical Research Associate, with an interview date set for 2023-11-20.&lt;|im_end|&gt;\n<\/code><\/pre>\n<h3>Training<\/h3>\n<p><img alt=\"LFM2.5-24B-A2B post-training recipe\" src=\"https://huggingface.co/LiquidAI/LFM2.5-24B-A2B/resolve/main/figures/LFM2.5-24B-A2B-Training-Recipe.png\" /><\/p>\n<p>LFM2.5-24B-A2B keeps the LFM2-24B-A2B architecture with two changes: the context window grows from 32K to 131K tokens, and the vocabulary doubles from 65K to 128K tokens through an <a target=\"_blank\" rel=\"noopener\" href=\"https://www.liquid.ai/blog/tokenizer-expansion\">in-place tokenizer expansion<\/a> for better non-Latin tokenization.<\/p>\n<ul>\n<li><strong>Pre-training<\/strong>: ~33T tokens, up from ~17T.<\/li>\n<li><strong>Mid-training<\/strong>: 2T tokens at 32K context on curated, higher-quality data weighted toward reasoning, math, code, instruction following, and multilingual text, then 300B tokens of long-context data at 131K context. Tool calls and multi-turn trajectories appear in both phases.<\/li>\n<li><strong>Post-training<\/strong>: supervised fine-tuning, teacher specialization, two multi-domain on-policy distillation stages (one non-agentic, one agentic), and agentic reinforcement learning inside popular agent harnesses (<a target=\"_blank\" rel=\"noopener\" href=\"https://openclaw.ai\">OpenClaw<\/a>, <a target=\"_blank\" rel=\"noopener\" href=\"https://hermes-agent.nousresearch.com\">Hermes Agent<\/a>, <a target=\"_blank\" rel=\"noopener\" href=\"https://pi.dev\">Pi<\/a>, <a target=\"_blank\" rel=\"noopener\" href=\"https://opencode.ai\">OpenCode<\/a>), so the model learns their tools, system prompts, and interaction patterns.<\/li>\n<\/ul>\n<h2>\ud83c\udfc3 Inference<\/h2>\n<p>LFM2.5 is supported by many inference frameworks. See the [Inference documentation](https://docs.liquid.ai/lfm/inference/tran<\/p>"}, "Nanbeige4.3-33B": {"repo": "Nanbeige/Nanbeige4.3-33B", "about": "Nanbeige4.3, a 33B dense Llama-architecture model with thinking, tool calls and a 512K window.", "likes": 1070, "downloads": 20702, "license": "apache-2.0", "updated": "2026-10-28", "html": "<div align=\"center\">\n<img src=\"figures/nbg.png\" width=\"200\" alt=\"Nanbeige Logo\">\n<\/div>\n\n<h1><span id=\"Introduction\">1. Introduction<\/span><\/h1>\n<p>In Nanbeige4.3, we take a foundational step toward pushing the boundaries of lightweight agents. Our strategy centers on building a high-capacity teacher agent first, which will subsequently anchor the distillation of advanced agentic capabilities into smaller models.<\/p>\n<p>To this end, we first introduce Nanbeige4.3-33B, designed as the flagship teacher model for the Nanbeige4.3 series. Delivering state-of-the-art agentic performance among open models in the ~30B parameter class, Nanbeige4.3-33B excels at complex coding and professional cowork tasks. It not only offers a powerful, cost-effective option for immediate real-world deployment, but also lays the necessary foundation to power our upcoming small model distillation pipeline (e.g., for Nanbeige4.3-3B).<\/p>\n<div align=\"center\">\n<img src=\"figures/nanbeige43-benchmarks.png\" width=\"1000\">\n<\/div>\n\n<h1><span id=\"Model-Performance\">2. Model Performance<\/span><\/h1>\n<p>We compare Nanbeige4.3-33B with recently released frontier models at around the 30B-parameter scale: Qwen3.8-27B, Muse-Glimmer-30B, and Gemma4-31B. All models are evaluated at their highest thinking effort. For each benchmark, we use the same inference hyperparameters and harness across models.<\/p>\n<table>\n  <thead>\n    <tr>\n      <th>Category<\/th><th>Benchmark<\/th><th>Nanbeige4.3-33B<sup>1<\/sup><\/th><th>Qwen3.8-27B<\/th><th>Muse-Glimmer-30B<\/th><th>Gemma4-31B<\/th>\n    <\/tr>\n  <\/thead>\n  <tbody>\n    <tr><td rowspan=\"8\">Agentic Coding<\/td><td>Terminal-Bench 2.1<sup>2<\/sup><\/td><td><strong>80.9<\/strong><\/td><td>73.0<\/td><td>61.8<\/td><td>47.2<\/td><\/tr>\n    <tr><td>Terminal-Bench 4.0<sup>3<\/sup><\/td><td><strong>23.8<\/strong><\/td><td>6.3<\/td><td>1.6<\/td><td>0.0<\/td><\/tr>\n    <tr><td>DeepSWE<sup>3<\/sup><\/td><td><strong>65.5<\/strong><\/td><td>42.5<\/td><td>4.4<\/td><td>2.7<\/td><\/tr>\n    <tr><td>SWE-Bench Pro<sup>3<\/sup><\/td><td>60.3<\/td><td><strong>61.7<\/strong><\/td><td>51.2<\/td><td>36.9<\/td><\/tr>\n    <tr><td>SWE-Atlas-QnA<sup>4<\/sup><\/td><td><strong>50.8<\/strong><\/td><td>41.9<\/td><td>17.7<\/td><td>3.3<\/td><\/tr>\n    <tr><td>NL2Repo<sup>5<\/sup><\/td><td><strong>53.0<\/strong><\/td><td>48.3<\/td><td>27.4<\/td><td>33.8<\/td><\/tr>\n    <tr><td>Scicode<\/td><td><strong>52.6<\/strong><\/td><td>46.7<\/td><td>44.9<\/td><td>45.5<\/td><\/tr>\n    <tr><td>SkillsBench<\/td><td><strong>61.1<\/strong><\/td><td>56.4<\/td><td>39.7<\/td><td>28.9<\/td><\/tr>\n    <tr><td rowspan=\"9\">Agentic Cowork<\/td><td>Automation Bench<sup>6<\/sup><\/td><td><strong>54.2<\/strong><\/td><td>38.3<\/td><td>15.2<\/td><td>9.7<\/td><\/tr>\n    <tr><td>JobBench<sup>7<\/sup><\/td><td><strong>44.8<\/strong><\/td><td>34.5<\/td><td>16.6<\/td><td>9.0<\/td><\/tr>\n    <tr><td>GDPval<sup>8<\/sup><\/td><td>84.8<\/td><td><strong>86.4<\/strong><\/td><td>75.8<\/td><td>71.4<\/td><\/tr>\n    <tr><td>Claw-Eval<sub>pass^3<\/sub><sup>9<\/sup><\/td><td><strong>78.3<\/strong><\/td><td>75.2<\/td><td>57.3<\/td><td>44.2<\/td><\/tr>\n    <tr><td>Toolathlon-Verified<sup>10<\/sup><\/td><td><strong>70.4<\/strong><\/td><td>68.5<\/td><td>47.2<\/td><td>27.8<\/td><\/tr>\n    <tr><td>DeepPlanning<sup>12<\/sup><\/td><td><strong>63.3<\/strong><\/td><td>49.2<\/td><td>21.4<\/td><td>19.4<\/td><\/tr>\n    <tr><td>EnterpriseOps-Gym<sup>12<\/sup><\/td><td><strong>41.0<\/strong><\/td><td>40.2<\/td><td>30.5<\/td><td>27.3<\/td><\/tr>\n    <tr><td>YC-bench<sup>11<\/sup><\/td><td><strong>$1,025,437<\/strong><\/td><td>$641,290<\/td><td>$513,978<\/td><td>$265,152<\/td><\/tr>\n    <tr><td>Tau3-Bench<sup>12<\/sup><\/td><td><strong>48.8<\/strong><\/td><td>48.5<\/td><td>33.7<\/td><td>18.6<\/td><\/tr>\n    <tr><td rowspan=\"3\">Reasoning<\/td><td>GPQA Diamond<\/td><td>89.5<\/td><td>89.2<\/td><td>83.5<\/td><td><strong>91.3<\/strong><\/td><\/tr>\n    <tr><td>AIME 2026<\/td><td><strong>95.2<\/strong><\/td><td>94.5<\/td><td>94.7<\/td><td>89.2<\/td><\/tr>\n    <tr><td>AA-LCR<\/td><td><strong>84.0<\/strong><\/td><td>82.0<\/td><td>83.3<\/td><td>72.0<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<p><small>\n<sup>1<\/sup> Nanbeige4.3-33B is evaluated with <code>preserve_thinking=true<\/code> in the chat template.<br>\n<sup>2<\/sup> Terminal-Bench 2.1 is evaluated using Terminus 2.<br>\n<sup>3<\/sup> Terminal-Bench 4 and DeepSWE are evaluated using mini-swe-agent v2.4.6.<br>\n<sup>4<\/sup> SWE-Atlas-QnA is evaluated using mini-swe-agent v2.4.6. Answers are evaluated against 1,304 task-specific rubrics using GPT-6 Sol as the judge, with medium reasoning effort.<br>\n<sup>5<\/sup> NL2Repo is evaluated using Claude Code.<br>\n<sup>6<\/sup> Automation Bench v1.0.6 includes 600 publicly released tasks.<br>\n<sup>7<\/sup> JobBench is evaluated with the Claude Code harness equipped with a search tool.<br>\n<sup>8<\/sup> GDPval is scored using revised rubrics.<br>\n<sup>9<\/sup> Claw-Eval is evaluated exclusively on the Claw-Eval General subset (comprising 157 single-turn user interaction tasks).<br>\n<sup>10<\/sup> Toolathlon-Verified sets no max_tokens limit for individual model requests.<br>\n<sup>11<\/sup> YC-bench retains only the most recent 10 turns of user dialogue as historical context before each model call.<br>\n<sup>12<\/sup> DeepPlanning, EnterpriseOps-Gym, Tau3-Bench are evaluated using their official repositories.<br>\n<\/small><\/p>\n<p>Nanbeige4.3-33B leads on most of the benchmarks, showing strong performance in both agentic coding and cowork tasks. \nBeyond its breadth across benchmarks, Nanbeige4.3-33B shows strong performance on <strong>agent tasks across a wide range of professions and industries<\/strong>. For example, on JobBench, it outperforms the baseline in most of the 35 occupations evaluated.<\/p>\n<div align=\"center\">\n  <img src=\"figures/occupation.png\" width=\"1000\" alt=\"occupation\">\n<\/div>\n\n<h1><span id=\"Quickstart\">3. Quickstart<\/span><\/h1>\n<p>The tokenizer provides a configurable chat template for reasoning and tool-use scenarios:<\/p>\n<ul>\n<li><code>enable_thinking<\/code> controls whether the model generates reasoning for the current response. It is enabled by default; set it to <code>False<\/code> for non-thinking mode.<\/li>\n<li><code>preserve_thinking<\/code> controls whether reasoning from previous assistant turns is retained in a multi-turn conversation. We recommend <code>False<\/code> for general chat and question answering, and <code>True<\/code> for multi-turn tool use, office tasks, and code-agent workflows.<\/li>\n<li>Passing <code>tools<\/code> enables the tool-use template. We recommend <code>tool_call_format=\"xml\"<\/code> for the best tool-calling performance; <code>json<\/code> is also supported for compatibility.<\/li>\n<\/ul>\n<p>The model supports a context length of up to 524,288 tokens (512K).<\/p>\n<p>We recommend adjusting the inference settings according to the target scenario:<\/p>\n<table>\n<thead>\n<tr>\n<th>Scenario<\/th>\n<th style=\"text-align: right;\">Temperature<\/th>\n<th style=\"text-align: right;\">Top_p<\/th>\n<th style=\"text-align: right;\">Max New Tokens<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Agentic and tool-use tasks<\/td>\n<td style=\"text-align: right;\">1.0<\/td>\n<td style=\"text-align: right;\">0.95<\/td>\n<td style=\"text-align: right;\">65,536<\/td>\n<\/tr>\n<tr>\n<td>Reasoning and chat tasks<\/td>\n<td style=\"text-align: right;\">0.6<\/td>\n<td style=\"text-align: right;\">0.95<\/td>\n<td style=\"text-align: right;\">262,144<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>You can run the model with Transformers, SGLang, or vLLM:<\/p>\n<h2>Transformers<\/h2>\n<pre><code class=\"language-python\">from transformers import AutoModelForCausalLM, AutoTokenizer\n\nmodel_id = 'Nanbeige/Nanbeige4.3-33B'\ntokenizer = AutoTokenizer.from_pretrained(\n  model_id,\n  use_fast=False,\n  trust_remote_code=True\n)\nmodel = AutoModelForCausalLM.from_pretrained(\n  model_id,\n  torch_dtype='auto',\n  device_map='auto',\n  trust_remote_code=True\n)\n\nmessages = [{'role': 'user', 'content': 'Which number is bigger, 9.11 or 9.8?'}]\ninputs = tokenizer.apply_chat_template(\n  messages,\n  add_generation_prompt=True,\n  return_tensors='pt'\n).to(model.device)\noutput_ids = model.generate(inputs, max_new_tokens=1024)\nresponse = tokenizer.decode(output_ids[0][inputs.shape[-1]:], skip_special_tokens=True)\nprint(response)\n<\/code><\/pre>\n<h2>SGLang<\/h2>\n<pre><code class=\"language-bash\">MODEL_PATH=/path/to/your/Nanbeige4.3-33B\npython -m sglang.launch_server \\\n  --model-path ${MODEL_PATH} \\\n  --host 0.0.0.0 \\\n  --port 8000 \\\n  --tp-size 4 \\\n  --mem-fraction-static 0.8 \\\n  --reasoning-parser qwen3 \\\n  --tool-call-parser qwen3_coder\n<\/code><\/pre>\n<h2>vLLM<\/h2>\n<pre><code class=\"language-bash\">MODEL_PATH=/path/to/your/Nanbeige4.3-33B\nvllm serve ${MODEL_PATH} \\\n  --host 0.0.0.0 \\\n  --port 8000 \\\n  --tensor-parallel-size 4 \\\n  --gpu-memory-utilization 0.8 \\\n  --enable-auto-tool-choice \\\n  --reasoning-parser qwen3 \\\n  --tool-call-parser qwen3_coder\n<\/code><\/pre>\n<h1><span id=\"Contact\">4. Contact<\/span><\/h1>\n<p>If you have any questions, please open an issue in this repository or contact us at nanbeige@kanzhun.com.<\/p>\n<p>We also welcome collaborations to build domain-specific and industry-focused agents, including joint work on data and training.<\/p>\n<h1><span id=\"Citation\">5. Citation<\/span><\/h1>\n<p>If you find our model useful or would like to use it in your own work, please cite this Hugging Face project:<\/p>\n<pre><code class=\"language-bibtex\">@misc{nanbeige43chat2026,\n  title        = {Nanbeige4.3-33B},\n  author       = {Nanbeige Team},\n  year         = {2026},\n  publisher    = {Hugging Face},\n  howpublished = {\\url{https://huggingface.co/Nanbeige/Nanbeige4.3-33B}}\n}\n<\/code><\/pre>"}, "Ornith-1.5-35B": {"repo": "ornith-ai/Ornith-1.5-35B-A3B", "about": "Ornith 1.5, a 35B mixture-of-experts with built-in MTP.", "likes": 784, "downloads": 286024, "license": "mit", "updated": "2026-08-23", "html": "<p><img width=\"600px\" src=\"assets/ornith_logo.png\"><\/p>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://deep-reinforce.com/ornith.html\"><img alt=\"Ornith Blog\" src=\"https://img.shields.io/badge/%F0%9F%A6%A2%EF%B8%8F%20Ornith%20Blog%20-FD8E5B\" /><\/a><\/p>\n<h1>Ornith-1.5-35B-A3B<\/h1>\n<p>Chirp Chirp! \ud83d\udc26 We are introducing Ornith-1.5, a major step toward building foundation models through end-to-end self-improvement.<\/p>\n<p>Ornith-1.5 extends Ornith-1.0 (which was developed on top of Qwen3.5 and Gemma4 with additional continued pretraining, mid-training, and post-training) by expanding the self-improvement loop from scaffold and rollout optimization to jointly optimizing task generation, scaffold construction, and solution rollouts. Rather than relying on a fixed set of human-curated tasks and manually designed harnesses, Ornith-1.5 continuously generates new training tasks, discovers effective strategies for solving them, and improves the policy through reinforcement learning. For more details on the task, harness, and rollout reward design, please refer to our <a target=\"_blank\" rel=\"noopener\" href=\"https://ornith.ai/ornith_1_5.html\">blog<\/a>.<\/p>\n<p><img style=\"width: 100%; max-width: 900px;\" src=\"assets/ornith_35b_eval.png\" alt=\"Ornith 1.5 35B Benchmark Results\" title=\"Ornith 1.5 35B Benchmark Results\"><\/p>\n<h2>Ornith 1.5 35B-A3B<\/h2>\n<p>This model card documents <strong>Ornith-1.5-35B-A3B<\/strong>, the mid-size mixture-of-experts member of the Ornith-1.5 family. It activates only ~3B parameters per token, yet significantly outperforms its similar-sized peer Qwen 3.6-35B across all coding and agentic benchmarks, and outperforms dense models such as Gemma 4-31B and Muse Glimmer-30B by wide margins on agentic coding.<\/p>\n<h3>Benchmarks<\/h3>\n<div style=\"font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;width:100%;margin:0 auto;padding:16px 0\">\n<table style=\"width:100%;table-layout:fixed;border-collapse:collapse;font-size:13px\">\n<thead><tr>\n<th style=\"width:22%;padding:10px 7px;text-align:left;font-weight:600;border-bottom:2px solid #FD8E5B;color:#FD8E5B\"><\/th>\n<th style=\"width:13%;padding:10px 7px;text-align:center;font-weight:700;border-bottom:2px solid #FD8E5B;color:#FD8E5B;font-size:14px;background:rgba(253, 142, 91, 0.12)\">Ornith-1.5-35B-A3B<\/th>\n<th style=\"width:13%;padding:10px 7px;text-align:center;font-weight:500;border-bottom:2px solid #FD8E5B;color:#FD8E5B;font-size:14px\">Ornith-1.0-35B-A3B<\/th>\n<th style=\"width:13%;padding:10px 7px;text-align:center;font-weight:500;border-bottom:2px solid #FD8E5B;color:#FD8E5B;font-size:14px\">Qwen3.6-35B-A3B<\/th>\n<th style=\"width:13%;padding:10px 7px;text-align:center;font-weight:500;border-bottom:2px solid #FD8E5B;color:#FD8E5B;font-size:14px\">Gemma-4-31B <sub><\/sub><\/th>\n<th style=\"width:13%;padding:10px 7px;text-align:center;font-weight:500;border-bottom:2px solid #FD8E5B;color:#FD8E5B;font-size:14px\">Muse-Glimmer-30B <sub><\/sub><\/th>\n<th style=\"width:13%;padding:10px 7px;text-align:center;font-weight:500;border-bottom:2px solid #FD8E5B;color:#FD8E5B;font-size:14px\">Qwen3.5-397B<\/th>\n<\/tr><\/thead>\n<tbody>\n<tr><td colspan=\"7\" style=\"padding:8px 12px;font-weight:600;color:#FD8E5B;border-bottom:1px solid rgba(253, 142, 91, 0.2);background:rgba(253, 142, 91, 0.1)\">Coding<\/td><\/tr>\n<tr>\ id rgba(128, 128, 128, 0.15);font-weight:600;color:#FD8E5B;background:rgba(253, 142, 91, 0.06)\">79<\/td>\n<td style=\"padding:7px 7px;text-align:center;border-bottom:1px solid rgba(128, 128, 128, 0.15)\">75.6<\/td>\n<td style=\"padding:7px 7px;text-align:center;border-bottom:1px solid rgba(128, 128, 128, 0.15)\">73.4<\/td>\n<td style=\"padding:7px 7px;text-align:center;border-bottom:1px solid rgba(128, 128, 128, 0.15)\">52<\/td>\n<td style=\"padding:7px 7px;text-align:center;border-bottom:1px solid rgba(128, 128, 128, 0.15)\">76<\/td>\n<td style=\"padding:7px 7px;text-align:center;border-bottom:1px solid rgba(128, 128, 128, 0.15)\">76.4<\/td>\n<\/tr>\n<tr>\n<td style=\"padding:7px 7px;padding-left:20px;border-bottom:1px solid rgba(128, 128, 128, 0.15);\">SWE-bench Pro<\/td>\n<td style=\"padding:7px 7px;text-align:center;border-bottom:1px solid rgba(128, 128, 128, 0.15);font-weight:600;color:#FD8E5B;background:rgba(253, 142, 91, 0.06)\">59.6<\/td>\n<td style=\"padding:7px 7px;text-align:center;border-bottom:1px solid rgba(128, 128, 128, 0.15)\">50.4<\/td>\n<td style=\"padding:7px 7px;text-align:center;border-bottom:1px solid rgba(128, 128, 128, 0.15)\">49.5<\/td>\n<td style=\"padding:7px 7px;text-align:center;border-bottom:1px solid rgba(128, 128, 128, 0.15)\">35.7<\/td>\n<td style=\"padding:7px 7px;text-align:center;border-bottom:1px solid rgba(128, 128, 128, 0.15)\">51.2<\/td>\n<td style=\"padding:7px 7px;text-align:center;border-bottom:1px solid rgba(128, 128, 128, 0.15)\">51.6<\/td>\n<\/tr>\n<tr>\n<td style=\"padding:7px 7px;padding-left:20px;border-bottom:1px solid rgba(128, 128, 128, 0.15);\">SWE-bench Multilingual<\/td>\n<td style=\"padding:7px 7px;text-align:center;border-bottom:1px solid rgba(128, 128, 128, 0.15);font-weight:600;color:#FD8E5B;background:rgba(253, 142, 91, 0.06)\">71.4<\/td>\n<td style=\"padding:7px 7px;text-align:center;border-bottom:1px solid rgba(128, 128, 128, 0.15)\">69.3<\/td>\n<td style=\"padding:7px 7px;text-align:center;border-botto
