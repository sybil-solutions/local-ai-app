n:center;border-bottom:1px solid rgba(128, 128, 128, 0.15)\">1.4<\/"}, "Qwen3.8-27B": {"repo": "Qwen/Qwen3.8-27B", "about": "Alibaba's 27B dense model from August 2026, and the strongest model that fits one consumer card. It thinks before it answers, calls tools reliably and reads images, which makes it the default for coding agents and long projects.", "likes": 19484, "downloads": 7508158, "license": "apache-2.0", "updated": "2026-11-07", "html": "<hr />\n<p>library_name: transformers\nlicense: apache-2.0\npipeline_tag: image-text-to-text<\/p>\n<hr />\n<h1>Qwen3.8-27B<\/h1>\n<blockquote>\n<p>[!Note]\nThis repository contains model weights and configuration files for the post-trained model in the Hugging Face Transformers format. <\/p>\n<p>These artifacts are compatible with Hugging Face Transformers, vLLM, SGLang, TokenSpeed, etc.<\/p>\n<p>[!Tip]\nFor users seeking managed, scalable inference without infrastructure maintenance, the official Qwen API service is provided by <a target=\"_blank\" rel=\"noopener\" href=\"https://www.qwencloud.com\">Qwen Cloud<\/a>.\nIn particular, <strong>Qwen3.8-27B<\/strong> will be available as a hosted version with more production features, e.g., 1M context length by default, official built-in tools. For more information, please refer to the <a target=\"_blank\" rel=\"noopener\" href=\"https://www.qwencloud.com/models/qwen3.8-27b\">Qwen3.8-27B Overview<\/a>. The service is coming soon. Stay tuned for updates.<\/p>\n<\/blockquote>\n<p>Following the widespread community adoption of the Qwen3.5 and Qwen3.6 series, we are pleased to introduce Qwen3.8, the most capable generation in the Qwen open-model family to date.<\/p>\n<p>Built on the architectural foundation of Qwen3.5, Qwen3.8 delivers substantial gains across coding, professional work, research, and long-horizon agentic tasks. Qwen3.8-27B brings these advances to a compact, deployment-friendly dense model: a native vision-language model that understands images and videos, with flexible thinking control, designed to carry complex, multi-step tasks through to completion with greater reliability.<\/p>\n<h2>Qwen3.8 Highlights<\/h2>\n<p>Qwen3.8-27B features the following enhancements:\n- <strong>Core Capabilities<\/strong>: Comprehensive improvements across coding, professional work, research, and long-horizon agentic tasks.\n- <strong>Agent Execution<\/strong>: Stronger autonomous planning and better handling of environment feedback, leading to more reliable end-to-end task completion.\n- <strong>Downstream Compatibility<\/strong>: Broader support for popular harnesses and development tools, making it easier to integrate into your existing stack.\n- <strong>Flexible Thinking Control<\/strong>: Thinking mode is on by default and can be disabled per request; reasoning depth can be tuned with <code>reasoning_effort<\/code>, and reasoning context from historical messages is retained via <code>preserve_thinking<\/code>.\n- <strong>Vision-Language Understanding<\/strong>: Native support for image and video understanding, from STEM diagrams and documents to hour-scale videos.<\/p>\n<h2>Model Overview<\/h2>\n<ul>\n<li>Type: Causal Language Model with Vision Encoder<\/li>\n<li>Training Stage: Pre-training &amp; Post-training<\/li>\n<li>Language Model<ul>\n<li>Number of Parameters: 27B<\/li>\n<li>Hidden Dimension: 5120<\/li>\n<li>Token Embedding: 248,320 (Padded)<\/li>\n<li>Number of Layers: 64<\/li>\n<li>Hidden Layout: 16 \u00d7 (3 \u00d7 (Gated DeltaNet \u2192 FFN) \u2192 1 \u00d7 (Gated Attention \u2192 FFN))<\/li>\n<li>Gated DeltaNet:<ul>\n<li>Number of Linear Attention Heads: 48 for V and 16 for QK<\/li>\n<li>Head Dimension: 128<\/li>\n<\/ul>\n<\/li>\n<li>Gated Attention:<ul>\n<li>Number of Attention Heads: 24 for Q and 4 for KV<\/li>\n<li>Head Dimension: 256<\/li>\n<li>Rotary Position Embedding Dimension: 64<\/li>\n<\/ul>\n<\/li>\n<li>Feed Forward Network:<ul>\n<li>Intermediate Dimension: 17,408<\/li>\n<\/ul>\n<\/li>\n<li>LM Output: 248,320 (Padded)<\/li>\n<li>MTP (Multi-Token Prediction): trained with multiple steps<\/li>\n<\/ul>\n<\/li>\n<li>Context Length: 262,144 natively and extensible up to 1,000,000 tokens.<\/li>\n<\/ul>\n<h2>Benchmark Results<\/h2>\n<h3>Text Performance<\/h3>\n\n<div style=\"font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;max-width:1200px;margin:0 auto;padding:16px 0\">\n<table class=\"vl-table\" style=\"width:100%;table-layout:fixed;border-collapse:collapse;font-size:13px\">\n<thead><tr>\n<th style=\"padding:10px 7px;text-align:left;font-weight:600;border-bottom:2px solid #0A2EFE;color:#0A2EFE\"><\/th><th style=\"padding:10px 7px;text-align:center;font-weight:500;border-bottom:2px solid #0A2EFE;color:#0A2EFE;font-size: 14px;width:14.00%;background:rgba(10, 46, 254, 0.08);\">Qwen3.8-27B<\/th><th style=\"padding:10px 7px;text-align:center;font-weight:500;border-bottom:2px solid #0A2EFE;color:#0A2EFE;font-size: 14px;width:14.00%;\">Qwen3.6-27B<\/th><th style=\"padding:10px 7px;text-align:center;font-weight:500;border-bottom:2px solid #0A2EFE;color:#0A2EFE;font-size: 14px;width:14.00%;\">Qwen3.7-Plus<\/th><th style=\"padding:10px 7px;text-align:center;font-weight:500;border-bottom:2px solid #0A2EFE;color:#0A2EFE;font-size: 14px;width:14.00%;\">Muse Glimmer-30B<\/th><th style=\"padding:10px 7px;text-align:center;font-weight:500;border-bottom:2px solid #0A2EFE;color:#0A2EFE;font-size: 14px;width:14.00%;\">Opus4.6 Max<\/th><\/tr><\/thead>\n<tbody>\n<tr><td colspan=\"6\" style=\"padding:8px 12px;font-weight:600;color:#0A2EFE;border-bottom:1px solid rgba(10, 46, 254, 0.2);background:#D6DAFC\">Coding<\/td><\/tr>\n<tr>\n<td class=\"benchmark-cell\" style=\"padding:7px 7px;padding-left:20px;border-bottom:1px solid rgba(128, 128, 128, 0.15);\"><div class=\"benchmark-capability\" style=\"font-size:15px;font-weight:600;line-height:1.22;color:#171717\">Agentic terminal coding<\/div><div class=\"benchmark-name\" style=\"margin-top:4px;font-size:11px;font-weight:400;line-height:1.2;color:#6B6B6B\">Terminal Bench 2.1 (Terminus)<\/div><\/td>\n<td style=\"padding:7px 7px;text-align:center;border-bottom:1px solid rgba(128, 128, 128, 0.15);background:rgba(10, 46, 254, 0.08);vertical-align:middle;font-size:15px;line-height:1.2;\">73.0<\/td>\n<td style=\"padding:7px 7px;text-align:center;border-bottom:1px solid rgba(128, 128, 128, 0.15);vertical-align:middle;font-size:15px;line-height:1.2;\">63.4<\/td>\n<td style=\"padding:7px 7px;text-align:center;border-bottom:1px solid rgba(128, 128, 128, 0.15);vertical-align:middle;font-size:15px;line-height:1.2;\">64.0<\/td>\n<td style=\"padding:7px 7px;text-align:center;border-bottom:1px solid rgba(128, 128, 128, 0.15);vertical-align:middle;font-size:15px;line-height:1.2;\">51.7<\/td>\n<td style=\"padding:7px 7px;text-align:center;border-bottom:1px solid rgba(128, 128, 128, 0.15);vertical-align:middle;font-size:15px;line-height:1.2;\"><strong>78.2<\/strong><\/td>\n<\/tr>\n<tr>\n<td class=\"benchmark-cell\" style=\"padding:7px 7px;padding-left:20px;border-bottom:1px solid rgba(128, 128, 128, 0.15);\"><div class=\"benchmark-capability\" style=\"font-size:15px;font-weight:600;line-height:1.22;color:#171717\">Agentic coding<\/div><div class=\"benchmark-name\" style=\"margin-top:4px;font-size:11px;font-weight:400;line-height:1.2;color:#6B6B6B\">SWE-bench Pro<\/div><\/td>\n<td style=\"padding:7px 7px;text-align:center;border-bottom:1px solid rgba(128, 128, 128, 0.15);background:rgba(10, 46, 254, 0.08);vertical-align:middle;font-size:15px;line-height:1.2;\"><strong>61.7<\/strong><\/td>\n<td style=\"padding:7px 7px;text-align:center;border-bottom:1px solid rgba(128, 128, 128, 0.15);vertical-align:middle;font-size:15px;line-height:1.2;\">53.5<\/td>\n<td style=\"padding:7px 7px;text-align:center;border-bottom:1px solid rgba(128, 128, 128, 0.15);vertical-align:middle;font-size:15px;line-height:1.2;\">57.6<\/td>\n<td style=\"padding:7px 7px;text-align:center;border-bottom:1px solid rgba(128, 128, 128, 0.15);vertical-align:middle;font-size:15px;line-height:1.2;\">51.2<\/td>\n<td style=\"padding:7px 7px;text-align:center;border-bottom:1px solid rgba(128, 128, 128, 0.15);vertical-align:middle;font-size:15px;line-height:1.2;\">53.4<\/td>\n<\/tr>\n<tr>\n<td class=\"benchmark-cell\" style=\"padding:7px 7px;padding-left:20px;border-bottom:1px solid rgba(128, 128, 128, 0.15);\"><div class=\"benchmark-capability\" style=\"font-size:15px;font-weight:600;line-height:1.22;color:#171717\">Repo-level code generation<\/div><div class=\"benchmark-name\" style=\"margin-top:4px;font-size:11px;font-weight:400;line-height:1.2;color:#6B6B6B\">NL2Repo-Bench<\/div><\/td>\n<td style=\"padding:7px 7px;text-align:center;border-bottom:1px solid rgba(128, 128, 128, 0.15);background:rgba(10, 46, 254, 0.08);vertical-align:middle;font-size:15px;line-height:1.2;\">42.3<\/td>\n<td style=\"padding:7px 7px;text-align:center;border-bottom:1px solid rgba(128, 128, 128, 0.15);vertical-align:middle;font-size:15px;line-height:1.2;\">36.2<\/td>\n<td style=\"padding:7px 7px;text-align:center;border-bottom:1px solid rgba(128, 128, 128, 0.15);vertical-align:middle;font-size:15px;line-height:1.2;\">41.1<\/td>\n<td style=\"padding:7px 7px;text-align:center;border-bottom:1px solid rgba(128, 128"}, "Qwen3.8-Flash-Next": {"repo": "Qwen/Qwen3.8-Flash-Next", "about": "Qwen3.8's large mixture-of-experts model: far more knowledge than the 27B, with few active parameters, so it stays fast.", "likes": 6881, "downloads": 3471211, "license": "other", "updated": "2026-11-07", "html": "<h1>Qwen3.8-Flash-Next<\/h1>\n<blockquote>\n<p>[!Note]\nThis repository contains model weights and configuration files for the post-trained model in the Hugging Face Transformers format. <\/p>\n<p>These artifacts are compatible with Hugging Face Transformers, vLLM, SGLang, TokenSpeed, etc.<\/p>\n<p>[!Tip]\nFor users seeking managed, scalable inference without infrastructure maintenance, the official Qwen API service is provided by <a target=\"_blank\" rel=\"noopener\" href=\"https://www.qwencloud.com\">Qwen Cloud<\/a>.<\/p>\n<p>In particular, <strong>Qwen3.8-Flash<\/strong> is the official version based on Qwen3.8-Flash-Next with more production features, e.g., 1M context length by default, official built-in tools. For more information, please refer to the <a target=\"_blank\" rel=\"noopener\" href=\"https://www.qwencloud.com/models/qwen3.8-flash\">Qwen3.8-Flash Overview<\/a>.<\/p>\n<\/blockquote>\n<p>As the frontier of foundation models pushes toward ever-larger parameter counts and ever-longer context windows, the question is no longer just how much we can scale, but how efficiently we can do so. Sustainable progress toward artificial general intelligence (AGI) that benefits everyone demands architectural innovation. Today, we are sharing a concrete step in that direction: Qwen3.8-Flash-Next. <\/p>\n<p><img alt=\"Qwen3.8-Flash-Next Architecture\" src=\"https://qianwen-res.oss-accelerate.aliyuncs.com/Qwen3.8-Flash-Next/architecture.png\" /><\/p>\n<p>This experimental preview of the architecture that will underpin Qwen4 is built around a fundamental rethinking of how the core components of modern large language models (LLMs) interact at scale.<\/p>\n<h2>Highlights<\/h2>\n<p>The first open-weight release under this architecture is Qwen3.8-Flash-Next, which introduces:<\/p>\n<ul>\n<li><strong>Hybrid Attention with QSA<\/strong>: The Gated DeltaNet and Gated Attention pairing has been reworked into Gated DeltaNet and Qwen Sparse Attention (QSA). Rather than selecting individual tokens for processing, QSA operates at the micro-block level. This cuts long-context latency significantly, a critical gain as agentic workloads increasingly dominate real-world usage.<\/li>\n<li><strong>Gated Residual<\/strong>: Residual streams with normalization are what make deep LLM training manageable. Gated Residual modulates information flowing through widened residual streams via an element-wise, data-dependent read gate and a per-branch scalar write gate. This brings finer-grained expressiveness across layers while preserving training stability and keeping inference overhead low.<\/li>\n<li><strong>N-gram Embedding<\/strong>: Embeddings provide a unique axis for parameter scaling that requires less computation and is more amenable to offloading than Mixture-of-Experts (MoE). By indexing with short n-grams, this approach makes parameter scaling highly efficient for memory-constrained accelerators without sacrificing quality.<\/li>\n<li><strong>Tailored Training Recipe<\/strong>: The Muon and AdamW optimizers are applied to specific weight categories to maximize efficiency. Guided by refitted scaling laws, we eliminate traditional batch-size warmups and start directly at the target batch size, substantially reducing total optimizer steps while safely supporting larger learning rates for robust convergence.<\/li>\n<\/ul>\n<p>For more details, please refer to our blog post <a target=\"_blank\" rel=\"noopener\" href=\"https://qwen.ai/blog?id=qwen3.8-flash-next\">Qwen3.8-Flash-Next<\/a> and <a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/QwenLM/Qwen3.8-Flash-Next/blob/main/tech_report.pdf\">the technical report<\/a>.<\/p>\n<p>We are excited to embark on this next chapter with you and welcome your feedback as we build what comes next.<\/p>\n<h2>Model Overview<\/h2>\n<ul>\n<li>Type: Causal Language Model with Vision Encoder<\/li>\n<li>Training Stage: Pre-training &amp; Post-training<\/li>\n<li>Language Model<ul>\n<li>Number of Parameters: 125B with 6B activated, plus 51B n-gram embedding and 4B MTP<\/li>\n<li>Hidden Dimension: 2560<\/li>\n<li>Token Embedding: 248320 (Padded)<\/li>\n<li>N-gram Embedding: 20,000,000 (bigrams/trigrams at layer 2)<\/li>\n<li>Number of Layers: 48<\/li>\n<li>Hidden Layout: 12 \u00d7 (3 \u00d7 (Gated DeltaNet \u2192 MoE) \u2192 1 \u00d7 (Qwen Sparse Attention \u2192 MoE))<\/li>\n<li>Gated DeltaNet:<ul>\n<li>Number of Linear Attention Heads: 48 for V and 16 for QK<\/li>\n<li>Head Dimension: 128<\/li>\n<\/ul>\n<\/li>\n<li>Qwen Sparse Attention:<ul>\n<li>Number of Attention Heads: 24 for Q and 2 for KV<\/li>\n<li>Head Dimension: 256<\/li>\n<li>Rotary Position Embedding Dimension: 64<\/li>\n<li>Indexer Structure: MQA with 4 Query Heads and 1 Shared Key Head<\/li>\n<li>Indexer Head Dimension: 128<\/li>\n<li>Budget: 512 blocks or 2048 tokens<\/li>\n<\/ul>\n<\/li>\n<li>Mixture Of Experts<ul>\n<li>Number of Experts: 512<\/li>\n<li>Number of Activated Experts: 10 Routed + 1 Shared<\/li>\n<li>Expert Intermediate Dimension: 640<\/li>\n<\/ul>\n<\/li>\n<li>Gated Residual:<ul>\n<li>Number of Branches: 4<\/li>\n<li>Bottleneck Rank: 320<\/li>\n<\/ul>\n<\/li>\n<li>LM Output: 248320 (Padded)<\/li>\n<li>MTP: 1 layer, trained with multi-steps<\/li>\n<\/ul>\n<\/li>\n<li>Context Length: 262,144 natively and extensible up to 1,000,000 tokens.<\/li>\n<\/ul>\n<h2>Benchmark Results<\/h2>\n\n\n<h3>Language<\/h3>\n<div style=\"font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;max-width:1200px;margin:0 auto;padding:16px 0\">\n<table class=\"vl-table\" style=\"width:100%;table-layout:fixed;border-collapse:collapse;font-size:13px\">\n<thead><tr>\n<th style=\"padding:10px 7px;text-align:left;font-weight:600;border-bottom:2px solid #0A2EFE;color:#0A2EFE\"><\/th><th style=\"padding:10px 7px;text-align:center;font-weight:500;border-bottom:2px solid #0A2EFE;color:#0A2EFE;font-size: 14px;width:14.00%;background:rgba(10, 46, 254, 0.08);\">Qwen3.8-Flash-Next<\/th><th style=\"padding:10px 7px;text-align:center;font-weight:500;border-bottom:2px solid #0A2EFE;color:#0A2EFE;font-size: 14px;width:14.00%;\">Qwen3.8-27B<\/th><th style=\"padding:10px 7px;text-align:center;font-weight:500;border-bottom:2px solid #0A2EFE;color:#0A2EFE;font-size: 14px;width:14.00%;\">Qwen3.7-Plus<\/th><th style=\"padding:10px 7px;text-align:center;font-weight:500;border-bottom:2px solid #0A2EFE;color:#0A2EFE;font-size: 14px;width:14.00%;\">DeepSeek-V4-Flash-0731<
