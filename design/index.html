<title>Local AI Fullscreen</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* The Local AI brand on a pan-and-zoom board: charcoal, hairlines, mono for words and labels, Geist for sentences, the dot hands edge to edge. */
:root { --ground: #101010; --bg: #161616; --surface: #1c1c1c; --line: #2e2e2e; --text: #ecEAE6; --muted: #8c8a86; --accent: #f2efe9; --red: #dc143c; --ui: Geist, system-ui, sans-serif; --display: "Instrument Serif", Georgia, serif; --dw: 400; --ds: italic; --dl: -.02em; --dsize: 38px; --dst: 100%; color-scheme: dark; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--text); font: 14px/1.45 var(--ui); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
#view { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: grab; }
#view.drag { cursor: grabbing; }
#board { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#board.ease { transition: transform .45s cubic-bezier(.2,.7,.2,1); }
.frame { position: absolute; width: 260px; }
.title, .label { font: 400 12px/1.3 var(--ui); color: var(--muted); }
.title { height: 26px; }
.rowname { position: absolute; font: var(--ds) var(--dw) 20px/1 var(--display); font-stretch: var(--dst); letter-spacing: var(--dl); white-space: nowrap; }
.arrow { position: absolute; color: var(--muted); font: 400 18px var(--ui); }
.screen { width: 260px; height: 520px; box-sizing: border-box; padding: 10px 14px 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; display: flex; flex-direction: column; gap: 10px; cursor: default; overflow: hidden; }
.cur .screen { border-color: var(--accent); }
.play .frame:not(.cur), .play .rowname, .play .arrow, .play #brand { visibility: hidden; }

.top { display: flex; justify-content: space-between; align-items: center; min-height: 32px; margin-right: -8px; }
.top .mark { font: 500 13px var(--ui); letter-spacing: -.03em; }
.top .mark { width: auto; height: 32px; color: var(--text); }
.top button:not(.mark) { width: 40px; height: 32px; color: var(--muted); font: 400 15px var(--ui); }
canvas.art { display: block; width: 260px; height: 128px; margin: 0 -14px; flex: none; }
.word { font: var(--ds) var(--dw) var(--dsize)/1.05 var(--display); font-stretch: var(--dst); letter-spacing: var(--dl); text-align: center; text-wrap: balance; }
.line { font: 400 13px/1.4 var(--ui); color: var(--muted); text-align: center; min-height: 20px; font-variant-numeric: tabular-nums; }
.sp { flex: 1; }
.home { display: flex; flex-direction: column; gap: 10px; }
.scroll { scrollbar-width: none; overflow-x: hidden; }
.scroll::-webkit-scrollbar { display: none; }
.scroll.home { margin: 0 -14px; padding: 0 14px; }
.scroll.home > * { flex: none; }
.ic { display: inline-flex; color: var(--muted); }
.icn { font: 400 12px var(--ui); color: var(--muted); margin-left: 2px; font-variant-numeric: tabular-nums; }
.ics { display: inline-flex; align-items: center; gap: 7px; flex: none; }
.mrow { border-radius: 8px; }
.mrow.on { background: var(--surface); }
.mhead { display: flex; align-items: center; }
.mpick { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; height: 42px; padding: 0 10px; text-align: left; font: 500 14px var(--ui); color: var(--muted); }
.mrow.on .mpick { color: var(--text); }
.mpick small { font: 400 12px var(--ui); color: var(--muted); }
.plus { width: 40px; height: 42px; font: 400 16px var(--ui); color: var(--muted); }
.mdetail { padding: 0 10px 10px; display: flex; flex-direction: column; gap: 8px; }
.kv.small .label, .kv.small b { padding: 6px 0; font-size: 12px; }
.kv.small b { font-weight: 500; }
.arow { border-bottom: 1px solid var(--line); }
.ahead { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-height: 52px; text-align: left; }
.at { min-width: 0; }
.at b { display: block; font: 500 14px var(--ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.at small { display: block; margin-top: 1px; font: 400 12px var(--ui); color: var(--muted); }
.arow .mdetail { padding: 0 0 12px; }
.editrow { display: flex; align-items: center; justify-content: space-between; min-height: 44px; border-bottom: 1px solid var(--line); font: 400 14px var(--ui); }
.editrow div { display: flex; }
.editrow button { width: 36px; height: 40px; color: var(--muted); font: 400 15px var(--ui); }
.editrow button[disabled] { opacity: .3; cursor: default; }
.wtitle { display: flex; justify-content: space-between; font: 500 13px var(--ui); }
.wtitle span { color: var(--muted); font-weight: 400; font-size: 12px; }
.wbtn { display: flex; flex-direction: column; gap: 6px; width: 100%; text-align: left; }
.minical { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); grid-template-columns: repeat(12, 1fr); gap: 2px; }
.minical i { display: block; aspect-ratio: 1; border-radius: 2px; }
.gpu { display: grid; grid-template-columns: 38px 1fr 62px; gap: 8px; align-items: center; font: 400 12px var(--ui); color: var(--muted); font-variant-numeric: tabular-nums; }
.gpu i { display: block; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.gpu i u { display: block; height: 100%; background: var(--text); text-decoration: none; }
.gpu span:last-child { text-align: right; }
.hero b { display: block; font: 600 24px/1.1 var(--ui); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.hero span { display: block; margin-top: 3px; font: 400 12px var(--ui); color: var(--muted); }
.cal { display: grid; gap: 2px; }
.cal.days { grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); grid-template-columns: repeat(var(--cols), 1fr); }
.cal.weeks { grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal button, .cal i { display: block; aspect-ratio: 1; border-radius: 2px; }
.cal.weeks button { border-radius: 4px; }

.cal.months { grid-template-columns: repeat(3, 1fr); gap: 4px; }
.cal.months button { aspect-ratio: auto; height: 58px; padding: 8px; border-radius: 6px; text-align: left; font: 400 12px var(--ui); }
.cal.months b { display: block; margin-top: 3px; font: 600 14px var(--ui); font-variant-numeric: tabular-nums; }
.cal-months { display: flex; justify-content: space-between; font: 400 11px var(--ui); color: var(--muted); }
.readout { display: flex; flex-direction: column; gap: 1px; font: 400 12px var(--ui); color: var(--muted); font-variant-numeric: tabular-nums; }
.readout b { font-weight: 500; color: var(--text); }
.legend { display: flex; align-items: center; justify-content: flex-end; gap: 3px; font: 400 11px var(--ui); color: var(--muted); }
.legend i { width: 9px; height: 9px; border-radius: 2px; }
.legend span { margin: 0 3px; }
.linkstat { display: block; width: 100%; text-align: left; }
.composer { display: flex; align-items: center; gap: 6px; padding: 5px; border: 1px solid var(--line); border-radius: 12px; }
.trig { flex: 1; min-width: 0; height: 36px; padding: 0 8px; text-align: left; border-radius: 7px; font: 500 14px var(--ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trig:hover { background: var(--surface); }
.trig small { margin-left: 6px; font: 400 12px var(--ui); color: var(--muted); }
.gosm { height: 36px; padding: 0 16px; border-radius: 7px; background: var(--accent); color: #12120f; font: 500 14px var(--ui); white-space: nowrap; }
.pop { position: absolute; left: 14px; right: 14px; bottom: 66px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.5); }
.pop button { display: flex; align-items: center; gap: 8px; width: 100%; height: 44px; padding: 0 10px; border-radius: 6px; text-align: left; font: 500 14px var(--ui); }
.pop button:hover { background: #262523; }
.pop small { flex: 1; font: 400 12px var(--ui); color: var(--muted); }
.pop u { text-decoration: none; font-size: 13px; }
.pop .more { font-weight: 400; color: var(--muted); border-top: 1px solid var(--line); border-radius: 0 0 6px 6px; margin-top: 4px; }
.mark i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 7px; vertical-align: 2px; }
.starts { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
.starts button { display: flex; justify-content: space-between; align-items: center; height: 68px; padding: 0 16px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line); }
.starts b { font: var(--ds) var(--dw) 26px/1 var(--display); font-stretch: var(--dst); letter-spacing: var(--dl); }
.starts small { font: 400 13px var(--ui); color: var(--muted); }
.starts button.main { background: var(--accent); color: #12120f; box-shadow: none; }
.starts button.main small { color: #55524c; }
.starts .more { height: 36px; box-shadow: none; justify-content: center; color: var(--muted); font: 400 13px var(--ui); }
.slide-pick { position: relative; height: 52px; margin: 0 -14px; overflow: hidden; }
.slide-pick div { position: absolute; left: 50%; top: 0; display: flex; }
.slide-pick button { width: 116px; height: 52px; color: var(--muted); font: var(--ds) var(--dw) 22px/1 var(--display); font-stretch: var(--dst); letter-spacing: var(--dl); }
.slide-pick button.on { color: var(--text); font-size: 32px; }
.quiet { display: block; margin: -2px auto 0; min-height: 36px; color: var(--muted); font: 400 14px var(--ui); }
.sheet-wrap { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 14px 14px; background: var(--surface); border-top: 1px solid var(--line); border-radius: 12px 12px 0 0; display: flex; flex-direction: column; gap: 2px; }
.sheet-wrap .grab { width: 34px; height: 3px; border-radius: 2px; background: var(--line); margin: 0 auto 10px; }
.sheet-row { display: flex; justify-content: space-between; align-items: center; width: 100%; height: 54px; }
.sheet-row b { font: var(--ds) var(--dw) 24px/1 var(--display); font-stretch: var(--dst); letter-spacing: var(--dl); color: var(--muted); }
.sheet-row.on b { color: var(--text); }
.sheet-row small { font: 400 13px var(--ui); color: var(--muted); }
.dimmed { opacity: .25; pointer-events: none; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.screen { position: relative; }
.pk-list button { display: flex; justify-content: space-between; align-items: baseline; width: 100%; padding: 7px 0; color: var(--muted); transition: color .2s; }
.pk-list button.on { color: var(--text); }
.pk-list b { font: var(--ds) var(--dw) 30px/1.1 var(--display); font-stretch: var(--dst); letter-spacing: var(--dl); }
.pk-list small { font: 400 13px var(--ui); }
.tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.tabs button { height: 44px; color: var(--muted); font: 500 14px var(--ui); }
.tabs button.on { color: var(--text); box-shadow: inset 0 -2px 0 var(--text); }
.tabs.two { display: flex; flex: none; width: 100%; margin: 0 0 4px; }
.tabs.two button { flex: 1; }
.arrows { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; }
.arrows button { height: 64px; font: 400 26px var(--ui); color: var(--muted); }
.arrows div { text-align: center; }
.arrows .word { font-size: calc(var(--dsize) * .86); }
.seg { display: flex; gap: 8px; }
.seg span { flex: 1; height: 40px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); }
.seg span.on { color: var(--text); border-color: var(--text); }
.slide { height: 28px; position: relative; }
.slide::before { content: ""; position: absolute; left: 0; right: 0; top: 13px; height: 1px; background: var(--line); }
.slide i { position: absolute; top: 7px; left: 34%; width: 14px; height: 14px; border-radius: 50%; background: var(--text); }
.word.wd { display: block; width: 100%; }
.wd .ch { font: 400 18px var(--ui); color: var(--muted); margin-left: 6px; vertical-align: 6px; font-style: normal; }
.dd { display: flex; justify-content: space-between; align-items: center; width: 100%; height: 44px; padding: 0 12px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 8px; font: 500 14px var(--ui); }
.dd span { color: var(--muted); }
.link { display: block; margin: -4px auto 0; min-height: 32px; color: var(--muted); font: 400 13px var(--ui); text-decoration: underline; text-underline-offset: 3px; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain; margin-right: -6px; padding-right: 6px; }
.item.tall { min-height: 52px; }
.item span b { display: block; font-weight: 500; }
.item span small { display: block; margin-top: 1px; }
.group { margin: 12px 0 4px; }
.group:first-child { margin-top: 0; }
.stats.twoup { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.bar { height: 1px; background: var(--line); }
.bar i { display: block; height: 1px; background: var(--accent); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 12px; }
.stat { border-top: 1px solid var(--line); padding-top: 8px; }
.stat b { display: block; font: 600 18px/1 var(--ui); letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.stat.live b { color: var(--accent); }
.stat .label { display: block; margin-top: 5px; }
.row { display: grid; grid-template-columns: 8px 76px minmax(0, 1fr) auto; align-items: center; gap: 8px; width: 100%; min-height: 44px; border-bottom: 1px solid var(--line); text-align: left; font: 400 13px var(--ui); }
.row u { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--muted); box-sizing: border-box; text-decoration: none; }
.row.on u { background: var(--accent); border-color: var(--accent); }
.row.on { font-weight: 500; }
.row em { font: 400 13px var(--ui); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row span { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.row.on span { color: var(--text); }
.item { display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 44px; border-bottom: 1px solid var(--line); text-align: left; font: 400 14px var(--ui); }
.item small { color: var(--muted); font: 400 12px var(--ui); }
.item[disabled] { color: var(--muted); cursor: default; }
.btn { display: block; width: 100%; height: 40px; border-radius: 8px; font: 500 14px var(--ui); text-align: center; box-shadow: inset 0 0 0 1px var(--line); }
.btn:hover:not([disabled]) { background: var(--surface); }
.go { background: var(--accent); color: #12120f; box-shadow: none; font-weight: 600; }
.btn.go:hover:not([disabled]) { background: var(--accent); filter: brightness(1.08); }
.neg { box-shadow: inset 0 0 0 1px var(--red); }
.btn[disabled] { color: var(--muted); cursor: default; }
.two { display: flex; gap: 8px; }
.two .btn:first-child { flex: 1; }
.two .btn:last-child { width: 44px; flex: none; color: var(--muted); }
.head { font: var(--ds) var(--dw) 20px/1.2 var(--display); font-stretch: var(--dst); letter-spacing: var(--dl); }
.kv { display: grid; grid-template-columns: 1fr auto; align-items: baseline; }
.kv .label, .kv b { border-bottom: 1px solid var(--line); padding: 11px 0; }
.kv b { font: 500 14px var(--ui); text-align: right; font-variant-numeric: tabular-nums; }
.box { font: 400 12px/1.6 var(--ui); border: 1px solid var(--line); border-radius: 4px; padding: 10px; color: var(--muted); overflow-wrap: anywhere; }
.field { height: 44px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 4px; padding: 0 12px; display: flex; align-items: center; color: var(--muted); font: 400 13px var(--ui); }
.bubble { padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; max-width: 85%; font-size: 13px; }
.bubble.me { align-self: flex-end; }
.next { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.next button { min-height: 34px; padding: 0 10px; border: 1px dashed #5e5c59; border-radius: 4px; font: 400 11px var(--ui); color: var(--muted); }
.next button:hover { color: var(--text); border-color: var(--text); }
#tools { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; z-index: 5; }
#tools button { min-width: 44px; height: 44px; padding: 0 12px; font: 400 12px var(--ui); white-space: nowrap; }
#tools button + button { border-left: 1px solid var(--line); }
#tools button[aria-pressed="true"] { color: var(--text); box-shadow: inset 0 -2px 0 var(--text); }
#tools .th { color: var(--muted); }
#tools .lab { display: flex; align-items: center; padding: 0 2px 0 10px; font: 400 11px var(--ui); color: var(--muted); }
#brand { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(14px + env(safe-area-inset-top, 0px)); font: 500 18px var(--ui); letter-spacing: -.03em; z-index: 5; pointer-events: none; }
@media (max-width: 520px) { #tools button { padding: 0 6px; min-width: 32px; } #out, #in, #canvas, #fit { display: none; } }
@media (prefers-reduced-motion: reduce) { #board.ease { transition: none; } }
/* Fullscreen layer. Same tokens and type scale as the frozen panel; the painting replaces the cut-out hands. */
#tools, #brand { display: none; }
#fs { display: none; }
html.wide #fs { display: block; position: fixed; inset: 0; z-index: 3; background: var(--bg); overflow: hidden; }
html.wide #view { visibility: hidden; }
.topr { display: flex; align-items: center; }
.top .topr button { display: inline-flex; align-items: center; justify-content: center; }
.item { position: relative; }
.item .inst { color: var(--accent); font: 500 12px var(--ui); }
.item.busy { cursor: default; color: var(--muted); }
.instbar { position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; overflow: hidden; }
.instbar::after { content: ""; position: absolute; top: 0; bottom: 0; width: 34%; background: var(--accent); animation: fsslide 1.1s ease-in-out infinite alternate; }
@keyframes fsslide { from { left: 0; } to { left: 66%; } }

@property --r { syntax: '<length>'; inherits: true; initial-value: 0px; }
#art { position: absolute; overflow: hidden; background: var(--ground); transition: --r 1.3s ease-out; --r: 0px; }
#art.rising { transition: --r 3.2s cubic-bezier(.3,.2,.5,1); }
#art img { position: absolute; max-width: none; }
#art .mono { filter: grayscale(1) brightness(.4) contrast(1.05); }
#art .color { filter: grayscale(1) brightness(.84) contrast(1.08); }
#art .color { -webkit-mask-image: radial-gradient(circle at var(--gx) var(--gy), #000 calc(var(--r) * .72), transparent var(--r)); mask-image: radial-gradient(circle at var(--gx) var(--gy), #000 calc(var(--r) * .72), transparent var(--r)); }
.glow, .spark { position: absolute; left: var(--gx); top: var(--gy); border-radius: 50%; opacity: 0; transition: opacity 1s .4s; pointer-events: none; }
.glow { width: 120px; height: 120px; margin: -60px 0 0 -60px; background: radial-gradient(closest-side, rgba(255,255,255,.95), rgba(255,255,255,0)); }
.spark { width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; background: #fff; box-shadow: 0 0 12px 3px #fff; }
#art.work .glow { opacity: .75; animation: fspulse var(--beat, 1s) ease-in-out infinite alternate; }
#art.work .spark { opacity: 1; }
@keyframes fspulse { from { transform: scale(.75); } to { transform: scale(1.15); } }
@keyframes fsfill { from { width: 0; } to { width: 100%; } }
#fs .bar i.fill { animation: fsfill 3.2s linear both; }

#ui { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
#ui > * { pointer-events: auto; }
#fs .line { text-align: center; }
.nname { font: 600 24px/1.2 var(--ui); letter-spacing: -.02em; }
.nsub { margin-top: 4px; font: 400 13px var(--ui); color: var(--muted); }
.ntrace { width: 100%; height: 48px; display: block; overflow: visible; }
.ntrace line { stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }
.ntrace polyline { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linejoin: round; vector-effect: non-scaling-stroke; opacity: .85; }
.wlabel { font: 500 13px var(--ui); }
#fs .gpu { grid-template-columns: 44px 1fr auto; }
#fs .gpu span { white-space: nowrap; }
#fs .kv { align-items: stretch; }

/* B. Cinema: the painting is the room, the words sit where it falls away. */
#art { inset: 0; }
.cfade { position: absolute; left: 0; right: 0; bottom: 0; height: 56%; background: linear-gradient(to bottom, rgba(22,22,22,0), rgba(22,22,22,.86) 46%, var(--bg) 78%); pointer-events: none !important; }
.cin { position: absolute; left: 56px; right: 56px; bottom: 40px; display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 40px; row-gap: 18px; align-items: end; }
.cin .ctitle { grid-column: 1 / -1; }
.cpicks { display: flex; gap: 40px; }
.cpick { text-align: left; padding: 10px 0 0; border-top: 1px solid var(--line); min-width: 170px; color: var(--muted); font: 500 14px var(--ui); }
.cpick small { display: block; margin-top: 3px; font: 400 12px var(--ui); color: var(--muted); font-variant-numeric: tabular-nums; }
.cpick.on { color: var(--text); border-top-color: var(--accent); }
.cin .btn { width: auto; padding: 0 22px; flex: none; }
.cin .cright { display: flex; align-items: center; gap: 8px; }
.cin .quiet { margin: 0; padding: 0 14px; }
.cin .two .btn:first-child { min-width: 150px; flex: none; }
.cin .two .btn:last-child { width: 44px; padding: 0; }
.cin .stats { display: flex; gap: 56px; }
.cin .stat { border: 0; padding: 0; }
.cin .stat b { font-size: 24px; }

const CARDS = {"GLM-5.3": {"repo": "zai-org/GLM-5.3", "about": "Z.ai's full GLM-5.3, the large sibling of GLM-5.3-Flash: frontier-class reasoning and agent work for a four-card workstation.", "likes": 2401, "downloads": 2016722, "license": "other", "updated": "2026-10-14", "html": "<h1>GLM-5.3<\/h1>\n<p>GLM-5.3 uses the same base model as GLM-5.2 \u2014 every gain comes from post-training. Compared with GLM-5.2, it is much better at complex coding and long-horizon tasks:<\/p>\n<ul>\n<li>Stronger Coding: GLM-5.3 is the most capable open-weights model for coding, with a 50% improvement over GLM-5.2 on our in-house Z.ai Code Bench. It also achieve open-source SOTA on public benchmarks including Terminal Bench 3.0 and Agents' Last Exam.<\/li>\n<li>Emergent Cyber Capability: As we scaled post-training, cyber capability developed faster than we expected. GLM-5.3 is state of the art on CyberGym for vulnerability discovery, and its gains are largest further up the exploitation chain, where it more than doubles GLM-5.2 on exploitation benchmarks.<\/li>\n<\/ul>\n<p><img alt=\"bench_53\" src=\"https://raw.githubusercontent.com/zai-org/GLM-5/refs/heads/main/resources/bench_53_2.png\" /><\/p>\n<h2>Benchmark<\/h2>\n<table>\n<thead>\n<tr>\n<th>Benchmark<\/th>\n<th>GLM-5.3<\/th>\n<th>GLM-5.2<\/th>\n<th>Kimi K3<\/th>\n<th>DeepSeek-V4 Pro-0813<\/th>\n<th>Qwen3.8-Max<\/th>\n<th>Opus 4.8<\/th>\n<th>Fable 5 (w/ fallback)<\/th>\n<th>GPT-5.6 Sol<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Terminal Bench 2.1<\/td>\n<td>88.2<\/td>\n<td>81.0<\/td>\n<td>88.3<\/td>\n<td>87.9<\/td>\n<td>86.6<\/td>\n<td>85.0<\/td>\n<td>88.0<\/td>\n<td><strong>88.8<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Terminal Bench 3.0<\/td>\n<td>28.3<\/td>\n<td>4.6<\/td>\n<td>17.4<\/td>\n<td>\u2013<\/td>\n<td>\u2013<\/td>\n<td>21.1<\/td>\n<td>33.7<\/td>\n<td><strong>34.6<\/strong><\/td>\n<\/tr>\n<tr>\n<td>DeepSWE (v1.1)<\/td>\n<td>66.9<\/td>\n<td>46.2<\/td>\n<td>67.5<\/td>\n<td>62.7<\/td>\n<td>56.6<\/td>\n<td>58.0<\/td>\n<td>69.7<\/td>\n<td><strong>72.7<\/strong><\/td>\n<\/tr>\n<tr>\n<td>NL2Repo<\/td>\n<td>58.0<\/td>\n<td>48.9<\/td>\n<td>58.0<\/td>\n<td>61.1<\/td>\n<td>55.9<\/td>\n<td><strong>69.7<\/strong><\/td>\n<td>\u2013<\/td>\n<td>\u2013<\/td>\n<\/tr>\n<tr>\n<td>ProgramBench (Almost Solved)<\/td>\n<td>19.0<\/td>\n<td>9.5<\/td>\n<td>17.5<\/td>\n<td>\u2013<\/td>\n<td>10.5<\/td>\n<td>15.5<\/td>\n<td><strong>33.0<\/strong><\/td>\n<td>23.0<\/td>\n<\/tr>\n<tr>\n<td>FrontierSWE<\/td>\n<td>78.1<\/td>\n<td>67.5<\/td>\n<td>\u2013<\/td>\n<td>\u2013<\/td>\n<td>\u2013<\/td>\n<td>66.5<\/td>\n<td><strong>88.2<\/strong><\/td>\n<td>\u2013<\/td>\n<\/tr>\n<tr>\n<td>SWE-Marathon (v1.1)<\/td>\n<td>42.5<\/td>\n<td>19.4<\/td>\n<td>48.1<\/td>\n<td>\u2013<\/td>\n<td>\u2013<\/td>\n<td><strong>48.8<\/strong><\/td>\n<td>33.1<\/td>\n<td>42.5<\/td>\n<\/tr>\n<tr>\n<td>PostTrainBench<\/td>\n<td>39.8<\/td>\n<td>31.7<\/td>\n<td>32.0<\/td>\n<td>\u2013<\/td>\n<td>\u2013<\/td>\n<td>32.9<\/td>\n<td><strong>41.8<\/strong><\/td>\n<td>36.2<\/td>\n<\/tr>\n<tr>\n<td>CyberGym<\/td>\n<td><strong>84.5<\/strong><\/td>\n<td>77.2<\/td>\n<td>80.0<\/td>\n<td>83.3<\/td>\n<td>78.5<\/td>\n<td>78.1<\/td>\n<td>83.8<\/td>\n<td>83.6<\/td>\n<\/tr>\n<tr>\n<td>ExploitGym (2h / 6h)<\/td>\n<td>105 / 130<\/td>\n<td>29 / 39<\/td>\n<td>36 / 70<\/td>\n<td>\u2013<\/td>\n<td>14 / 26<\/td>\n<td>80 / 120<\/td>\n<td>181 / 247<\/td>\n<td><strong>216 / 293<\/strong><\/td>\n<\/tr>\n<tr>\n<td>ExploitBench<\/td>\n<td>54.4<\/td>\n<td>24.4<\/td>\n<td>32.2<\/td>\n<td>\u2013<\/td>\n<td>28.8<\/td>\n<td>40.0<\/td>\n<td><strong>78.0<\/strong><\/td>\n<td>76.5<\/td>\n<\/tr>\n<tr>\n<td>Toolathlon Verified<\/td>\n<td>73.0<\/td>\n<td>59.9<\/td>\n<td><strong>76.5<\/strong><\/td>\n<td>74.1<\/td>\n<td>72.5<\/td>\n<td>76.2<\/td>\n<td>74.7<\/td>\n<td>74.9<\/td>\n<\/tr>\n<tr>\n<td>AutomationBench (v1.0.6)<\/td>\n<td><strong>48.2<\/strong><\/td>\n<td>26.2<\/td>\n<td>46.7<\/td>\n<td>43.2<\/td>\n<td>39.8<\/td>\n<td>41.0<\/td>\n<td>46.2<\/td>\n<td>45.8<\/td>\n<\/tr>\n<tr>\n<td>Agents' Last Exam (ALE-CLI)<\/td>\n<td>28.5<\/td>\n<td>23.8<\/td>\n<td>27.6<\/td>\n<td>25.7<\/td>\n<td>27.0<\/td>\n<td>25.7<\/td>\n<td>23.8<\/td>\n<td><strong>28.6<\/strong><\/td>\n<\/tr>\n<tr>\n<td>HLE w/ Tools<\/td>\n<td>62.5<\/td>\n<td>54.7<\/td>\n<td>59.8<\/td>\n<td>60.0<\/td>\n<td>56.2<\/td>\n<td>57.9<\/td>\n<td>63.9<\/td>\n<td><strong>64.5<\/strong><\/td>\n<\/tr>\n<tr>\n<td>GDPval-AA v2<\/td>\n<td><strong>1769<\/strong><\/td>\n<td>1508<\/td>\n<td>1682<\/td>\n<td>1590<\/td>\n<td>1739<\/td>\n<td>1588<\/td>\n<td>1743<\/td>\n<td>1730<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Serve GLM-5.3 Locally<\/h3>\n<p>GLM-5.3 supports deployment with the following frameworks. Feel free to try them out:<\/p>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/sgl-project/sglang\">SGLang<\/a> \u2014 see <a target=\"_blank\" rel=\"noopener\" href=\"https://cookbook.sglang.io/autoregressive/GLM/GLM-5.3\">cookbook<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/vllm-project/vllm\">vLLM<\/a> \u2014 see <a target=\"_blank\" rel=\"noopener\" href=\"https://recipes.vllm.ai/zai-org/GLM-5.3\">recipes<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/lightseekorg/tokenspeed\">TokenSpeed<\/a> \u2014 see <a target=\"_blank\" rel=\"noopener\" href=\"https://lightseek.org/tokenspeed/recipes/models#glm-5-3\">here<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/huggingface/transformers\">Transformers<\/a> \u2014 see <a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/huggingface/transformers/blob/main/docs/source/en/model_doc/glm_moe_dsa.md\">transformers docs<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/kvcache-ai/ktransformers\">KTransformers<\/a> \u2014 see <a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/kvcache-ai/ktransformers/blob/main/doc/en/kt-kernel/GLM-5.2-Tutorial.md\">tutorial<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/unslothai/unsloth\">Unsloth<\/a> \u2014 see <a target=\"_blank\" rel=\"noopener\" href=\"https://unsloth.ai/docs/models/GLM-5.3\">guide<\/a><\/li>\n<li>For deployment on the <code>Ascend NPU<\/code> platform, inference frameworks such as vLLM-Ascend, xLLM and SGLang are supported \u2014 see <a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/zai-org/GLM-5/blob/main/example/ascend.md\">here<\/a>.<\/li>\n<\/ul>\n<h3>Note<\/h3>\n<ul>\n<li>GLM-5.3 supports controlling the thinking budget through the <code>reasoning_effort<\/code> parameter, which accepts three levels: <code>low<\/code>, <code>high<\/code>, and <code>max<\/code>. It defaults to <code>max<\/code> if not passed (or if set to any other value). To use <code>low<\/code> or <code>high<\/code>, pass them explicitly. For benchmark and leaderboard reproduction, keep the default <code>max<\/code>.<\/li>\n<li>In the chat template for GLM-5.3, <code>clear_thinking<\/code> defaults to <code>false<\/code> if not passed. For chat scenarios, explicitly pass <code>clear_thinking=true<\/code>.<\/li>\n<\/ul>\n<h2>Footnotes<\/h2>\n<ul>\n<li><strong>HLE w/ tools<\/strong>: We use sampling parameters of <code>temperature=1.0<\/code> and <code>top_p=0.95<\/code> for evaluation, with a maximum generation length of <code>163,840<\/code> tokens. The evaluation is conducted with a maximum context length of <code>300,000<\/code> tokens, using a context management strategy. We use GPT-5.6-luna (medium) as the judge model.<\/li>\n<li><strong>NL2Repo<\/strong>: We evaluated NL2Repo with <code>temperature=1.0<\/code>, <code>top_p=1.0<\/code>, and <code>max_new_tokens=64k<\/code> under 1M context. To prevent hacking, we use rule-based and a LLM-based judgement to prevent malicious behaviors (e.g., unauthorized pip or curl operations).<\/li>\n<li><strong>DeepSWE<\/strong>: We run DeepSWE using the mini-swe-agent harness with <code>temperature=0.95<\/code>, <code>top_p=1.0<\/code>, <code>timeout=6h<\/code> and 400K context.<\/li>\n<li><strong>Terminal-Bench 2.1<\/strong>: We evaluate in Claude Code 2.1.207 with <code>temperature=1.0<\/code>, <code>top_p=1<\/code>, <code>max_new_tokens=65536<\/code> with 6h timeout.<\/li>\n<li><strong>Terminal-Bench 3.0<\/strong>: We evaluate Terminal-Bench-3 tasks with the Claude Code 2.1.207 harness (reasoning effort=max, 400K context, and 128K maximum output), reporting avg@3 over three rollouts per task. Each rollout runs in an isolated container built from the task's official image, and is capped at 600 agent turns with a 10-hour timeout. Tool Search is disabled, and the artifacts each agent produces are scored by the task's official separate verifier.<\/li>\n<li><strong>Agent's Last Exam (CLI)<\/strong>: We evaluate ALE using the official evaluation protocol with the Claude Code harness (reasoning effort=max, 1M context, and 64K maximum output). Each of the 105 tasks runs in an isolated Docker container using the resources declared in its Task Card. The default timeout is 4 hours, with task-specific limits taking precedence (up to 8 hours). Tool Search is disabled, and results are scored by the official ALE evaluators.<\/li>\n<li><strong>Toolathlon Verified<\/strong>: We obtain all results via the official evaluation service and report pass@1 averaged over 3 independent runs.<\/li>\n<li><strong>AutomationBench<\/strong>: We evaluate on AutomationBench <strong>v1.0.6<\/strong>, incorporating the fix for the <code>null<\/code>-type handling issue introduced in <a target=\"_blank\" rel=\"noopener\" href=\"[#](https://github.com/zapier/AutomationBench/pull/13)\">PR #13<\/a>.<\/li>\n<li><strong>GDPval-AA v2<\/strong>: Models are evaluated by Artificial Analysis.<\/li>\n<li><strong>CyberGym<\/strong>: We evaluate GLM-5.3 in Claude Code 2.1.207 (max reasoning effort, no web tools with <code>temperature=1.0<\/code>, <code>top_p=1.0<\/code>, <code>max_new_tokens=128000<\/code>). All evaluations are under unlimited timeout per task and results are single-run Pass@1 over 1,507 tasks. To simulate real-world usage scenarios, we place the agent inside the task container. We also remove all Git-related information and apply a domain whitelist (allowing only essential domains such as pypi.org and deb.debian.org for basic tool installation) to prevent the agent from cheating.<\/li>\n<li><strong>ExploitGym<\/strong>: We evaluate GLM-5.3, Kimi-K3 and Qwen3.8 Max in Claude Code 2.1.207 (max reasoning effort, no web tools with <code>temperature=1.0<\/code>, <code>top_p=1.0<\/code>, <code>max_new_tokens=128000<\/code>). The reported results are single-run Pass@1 on 869 tasks under two timeout budgets: 2 hours and 6 hours, which are calculated as the API inference time rescaled by per-model tokens per second rate (per-model TPS sourced from Artificial Analysis; that is, we rescale GLM-5.3's results by 115 TPS, Kimi K3's results by 40 TPS and Qwen3.8 Max's results by 47 TPS), plus the non-API overhead. We also apply a domain whitelist (allowing only essential domains such as pypi.org and deb.debian.org for basic tool installation) to prevent the agent from cheating.<\/li>\n<li><strong>ExploitBench<\/strong>: We evaluate GLM-5.3 in Claude Code 2.1.207 (max reasoning effort, no web tools with <code>temperature=1.0<\/code>, <code>top_p=1.0<\/code>, <code>max_new_tokens=128000<\/code>). Following the official evaluation settings, we limit the maximum number of interaction rounds between the agent and the environmen<\/li>\n<\/ul>"}, "Gemma 4 12B": {"repo": "google/gemma-4-12b-it", "about": "Google's Gemma 4 12B from May 2026: a compact multimodal model with thinking, good with images and documents.", "likes": 1729, "downloads": 1813366, "license": "apache-2.0", "updated": "2026-10-30", "html": "<div align=\"center\">\n  <img src=https://ai.google.dev/gemma/images/gemma4_banner.png>\n<\/div>\n\n<p align=\"center\">\n    <a target=\"_blank\" rel=\"noopener\" href=\"https://huggingface.co/collections/google/gemma-4\" target=\"_blank\">Hugging Face<\/a> |\n    <a target=\"_blank\" rel=\"noopener\" href=\"https://github.com/google-gemma\" target=\"_blank\">GitHub<\/a> |\n    <a target=\"_blank\" rel=\"noopener\" href=\"https://blog.google/innovation-and-ai/technology/developers-tools/introducing-gemma-4-12B/\" target=\"_blank\">Launch Blog<\/a> |\n    <a target=\"_blank\" rel=\"noopener\" href=\"https://ai.google.dev/gemma/docs/core\" target=\"_blank\">Documentation<\/a> |\n    <a target=\"_blank\" rel=\"noopener\" href=\"https://arxiv.org/abs/2607.02770\" target=\"_blank\">Technical Report<\/a>\n    <br>\n    <b>License<\/b>: <a target=\"_blank\" rel=\"noopener\" href=\"https://ai.google.dev/gemma/docs/gemma_4_license\" target=\"_blank\">Apache 2.0<\/a> | <b>Authors<\/b>: <a target=\"_blank\" rel=\"noopener\" href=\"https://deepmind.google/models/gemma/\" target=\"_blank\">Google DeepMind<\/a>\n<\/p>\n\n<blockquote>\n<p>[!Note]\nThis model card is for the Gemma 4 12B Unified model, which is part of the Gemma 4 family of open models. Built with the same multimodal functionality as Gemma 4 E2B and E4B (text, audio, image, and video inputs), it brings native audio and vision understanding directly to local environments without the need for separate encoders. This unified approach to multimodality makes the model encoder-free, offering a deployment size that is perfect for consumer devices and streamlined local execution.<\/p>\n<\/blockquote>\n<p>Gemma is a family of open models built by Google DeepMind. Gemma 4 models are multimodal, handling text and image input (with audio supported on E2B, E4B, and 12B) and generating text output. This release includes open-weights models in both pre-trained and instruction-tuned variants. Gemma 4 features a context window of up to 256K tokens and maintains multilingual support in over 140 languages. <\/p>\n<p>Featuring both Dense and Mixture-of-Experts (MoE) architectures, Gemma 4 is well-suited for tasks like text generation, coding, and reasoning. The models are available in five distinct sizes: <strong>E2B<\/strong>, <strong>E4B<\/strong>, <strong>12B<\/strong>, <strong>26B A4B<\/strong>, and <strong>31B<\/strong>. Their diverse sizes make them deployable in environments ranging from high-end phones to laptops and servers, democratizing access to state-of-the-art AI.<\/p>\n<p>Gemma 4 introduces key <strong>capability and architectural advancements<\/strong>:<\/p>\n<ul>\n<li>\n<p><strong>Reasoning<\/strong> \u2013 All models in the family are designed as highly capable reasoners, with configurable thinking modes.<\/p>\n<\/li>\n<li>\n<p><strong>Extended Multimodalities<\/strong> \u2013 Processes Text, Image with variable aspect ratio and resolution support (all models), Video, and Audio (featured natively on the E2B, E4B, and 12B models).<\/p>\n<\/li>\n<li>\n<p><strong>Diverse &amp; Efficient Architectures<\/strong> \u2013 Offers Dense and Mixture-of-Experts (MoE) variants of different sizes for scalable deployment.<\/p>\n<\/li>\n<li>\n<p><strong>Optimized for On-Device<\/strong> \u2013 Smaller models are specifically designed for efficient local execution on laptops and mobile devices.<\/p>\n<\/li>\n<li>\n<p><strong>Increased Context Window<\/strong> \u2013 The small models feature a 128K context window, while the medium models support 256K.<\/p>\n<\/li>\n<li>\n<p><strong>Enhanced Coding &amp; Agentic Capabilities<\/strong> \u2013 Achieves notable improvements in coding benchmarks alongside native function-calling support, powering highly capable autonomous agents.<\/p>\n<\/li>\n<li>\n<p><strong>Native System Prompt Support<\/strong> \u2013 Gemma 4 introduces native support for the <code>system<\/code> role, enabling more structured and controllable conversations.<\/p>\n<\/li>\n<\/ul>\n<h2><strong>Models Overview<\/strong><\/h2>\n<p>Gemma 4 models are designed to deliver frontier-level performance at each size, targeting deployment scenarios from mobile and edge devices (E2B, E4B) to consumer GPUs and workstations (12B, 26B A4B, 31B). They are well-suited for reasoning, agentic workflows, coding, and multimodal understanding.<\/p>\n<p>The models employ a hybrid attention mechanism that interleaves local sliding window attention with full global attention, ensuring the final layer is always global. This hybrid design delivers the processing speed and low memory footprint of a lightweight model without sacrificing the deep awareness required for complex, long-context tasks. To optimize memory for long contexts, global layers feature unified Keys and Values, and apply Proportional RoPE (p-RoPE). <\/p>\n<h3>Dense Models<\/h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Property<\/th>\n<th style=\"text-align: left;\">E2B<\/th>\n<th style=\"text-align: left;\">E4B<\/th>\n<th style=\"text-align: left;\">12B Unified<\/th>\n<th style=\"text-align: left;\">31B Dense<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>Total Parameters<\/strong><\/td>\n<td style=\"text-align: left;\">2.3B effective <br> (5.1B with embeddings)<\/td>\n<td style=\"text-align: left;\">4.5B effective <br> (8B with embeddings)<\/td>\n<td style=\"text-align: left;\">11.95B<\/td>\n<td style=\"text-align: left;\">30.7B<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Layers<\/strong><\/td>\n<td style=\"text-align: left;\">35<\/td>\n<td style=\"text-align: left;\">42<\/td>\n<td style=\"text-align: left;\">48<\/td>\n<td style=\"text-align: left;\">60<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Sliding Window<\/strong><\/td>\n<td style=\"text-align: left;\">512 tokens<\/td>\n<td style=\"text-align: left;\">512 tokens<\/td>\n<td style=\"text-align: left;\">1024 tokens<\/td>\n<td style=\"text-align: left;\">1024 tokens<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Context Length<\/strong><\/td>\n<td style=\"text-align: left;\">128K tokens<\/td>\n<td style=\"text-align: left;\">128K tokens<\/td>\n<td style=\"text-align: left;\">256K tokens<\/td>\n<td style=\"text-align: left;\">256K tokens<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Vocabulary Size<\/strong><\/td>\n<td style=\"text-align: left;\">262K<\/td>\n<td style=\"text-align: left;\">262K<\/td>\n<td style=\"text-align: left;\">262K<\/td>\n<td style=\"text-align: left;\">262K<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Supported Modalities<\/strong><\/td>\n<td style=\"text-align: left;\">Text, Image, Audio<\/td>\n<td style=\"text-align: left;\">Text, Image, Audio<\/td>\n<td style=\"text-align: left;\">Text, Image, Audio<\/td>\n<td style=\"text-align: left;\">Text, Image<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Vision Encoder Parameters<\/strong><\/td>\n<td style=\"text-align: left;\"><em>~150M<\/em><\/td>\n<td style=\"text-align: left;\"><em>~150M<\/em><\/td>\n<td style=\"text-align: left;\">-<\/td>\n<td style=\"text-align: left;\"><em>~550M<\/em><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Audio Encoder Parameters<\/strong><\/td>\n<td style=\"text-align: left;\"><em>~300M<\/em><\/td>\n<td style=\"text-align: left;\"><em>~300M<\/em><\/td>\n<td style=\"text-align: left;\">-<\/td>\n<td style=\"text-align: left;\">No Audio<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The \"E\" in E2B and E4B stands for \"effective\" parameters. The smaller models incorporate Per-Layer Embeddings (PLE) to maximize parameter efficiency in on-device deployments. Rather than adding more layers or parameters to the model, PLE gives each decoder layer its own small embedding for every token. These embedding tables are large but are only used for quick lookups, which is why the effective parameter count is much smaller than the total.<\/p>\n<p>The \"Unified\" in Gemma 4 12B Unified refers to its encoder-free architecture. Other Gemma 4 models use dedicated encoders to process multimodal data before passing it to the LLM. Gemma 4 12B eliminates these encoders entirely, projecting raw image patches and audio waveforms directly into the LLM's embedding space through lightweight linear layers. This unified approach means all modalities flow straight into a single decoder-only transformer, reducing multimodal latency and allowing the entire model to be fine-tuned in one pass.<\/p>\n<h3>Mixture-of-Experts (MoE) Model<\/h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Property<\/th>\n<th style=\"text-align: left;\">26B A4B MoE<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>Total Parameters<\/strong><\/td>\n<td style=\"text-align: left;\">25.2B<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Active Parameters<\/strong><\/td>\n<td style=\"text-align: left;\">3.8B<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Layers<\/strong><\/td>\n<td style=\"text-align: left;\">30<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Sliding Window<\/strong><\/td>\n<td style=\"text-align: left;\">1024 tokens<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Context Length<\/strong><\/td>\n<td style=\"text-align: left;\">256K tokens<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Vocabulary Size<\/strong><\/td>\n<td style=\"text-align: left;\">262K<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Expert Count<\/strong><\/td>\n<td style=\"text-align: left;\">8 active / 128 total and 1 shared<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Supported Modalities<\/strong><\/td>\n<td style=\"text-align: left;\">Text, Image<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Vision Encoder Parameters<\/strong><\/td>\n<td style=\"text-align: left;\"><em>~550M<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The \"A\" in 26B A4B stands for \"active parameters\" in contrast to the total number of parameters the model contains. By only activating a 4B subset of parameters during inference, the Mixture-of-Experts model runs much faster than its 26B total might suggest. This makes it an excellent choice for fast inference compared to the dense 31B model since it runs almost as fast as a 4B-parameter model.<\/p>\n<h2><strong>Benchmark Results<\/strong><\/h2>\n<p>These models were evaluated against a large collection of different datasets and metrics to cover different aspects of text generation. Evaluation results marked in the table are for instruction-tuned models.<\/p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\"><\/th>\n<th style=\"text-align: left;\">Gemma 4  31B<\/th>\n<th style=\"text-align: left;\">Gemma 4  26B A4B<\/th>\n<th style=\"text-align: left;\">Gemma 4 12B Unified<\/th>\n<th style=\"text-align: left;\">Gemma 4  E4B<\/th>\n<th style=\"text-align: left;\">Gemma 4  E2B<\/th>\n<th style=\"text-align: left;\">Gemma 3  27B (no think)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">MMLU Pro<\/td>\n<td style=\"text-align: left;\">85.2%<\/td>\n<td style=\"text-align: left;\">82.6%<\/td>\n<td style=\"text-align: left;\">77.2%<\/td>\n<td style=\"text-align: left;\">69.4%<\/td>\n<td style=\"text-align: left;\">60.0%<\/td>\n<td style=\"text-align: left;\">67.6%<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">AIME 2026 no tools<\/td>\n<td style=\"text-align: left;\">89.2%<\/td>\n<td style=\"text-align: left;\">88.3%<\/td>\n<td style=\"text-align: left;\">77.5%<\/td>\n<td style=\"text-align: left;\">42.5%<\/td>\n<td style=\"text-align: left;\">37.5%<\/td>\n<td style=\"text-align: left;\">20.8%<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">LiveCodeBench v6<\/td>\n<td style=\"text-align: left;\">80.0%<\/td>\n<td style=\"text-align: left;\">77.1%<\/td>\n<td style=\"text-align: left;\">72.0%<\/td>\n<td style=\"text-align: left;\">52.0%<\/td>\n<td style=\"text-align: left;\">44.0%<\/td>\n<td style=\"text-align: left;\">29.1%<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Codeforces ELO<\/td>\n<td style=\"text-align: left;\">2150<\/td>\n<td style=\"text-align: left;\">1718<\/td>\n<td style=\"text-align: left;\">1659<\/td>\n<td style=\"text-align: left;\">940<\/td>\n<td style=\"text-align: left;\">633<\/td>\n<td style=\"text-align: left;\">110<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">GPQA Diamond<\/td>\n<td style=\"text-align: left;\">84.3%<\/td>\n<td style=\"text-align: left;\">82.3%<\/td>\n<td style=\"text-align: left;\">78.8%<\/td>\n<td style=\"text-align: left;\">58.6%<\/td>\n<td style=\"text-align: left;\">43.4%<\/td>\n<td style=\"text-align: left;\">42.4%<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">Tau2 (average over 3)<\/td>\n<td style=\"text-align: left;\">76.9%<\/td>\n<td style=\"text-align: left;\">68.2%<\/td>\n<td style=\"text-align: left;\">69.0%<\/td>\n<td style=\"text-align: left;\">42.2%<\/td>\n<td style=\"text-align: left;\">24.5%<\/td>\n<td style=\"text-align: left;\">16.2%<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">HLE no tools<\/td>\n<td style=\"text-align: left;\">19.5%<\/td>\n<td style=\"text-align: left;\">8.7%<\/td>\n<td style=\"text-align: left;\">5.2%<\/td>\n<td style=\"text-align: left;\">-<\/td>\n<td style=\"text-align: left;\">-<\/td>\n<td style=\"text-align: left;\">-<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">HLE with search<\/td>\n<td style=\"text-align: left;\">26.5%<\/td>\n<td style=\"text-align: left;\">17.2%<\/td>\n<td style=\"text-align: left;\">-<\/td>\n<td style=\"text-align: left;\">-<\/td>\n<td style=\"text-align: left;\">-<\/td>\n<td style=\"text-align: left;\">-<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">BigBench Extra Hard<\/td>\n<td style=\"text-align: left;\">74.4%<\/td>\n<td style=\"text-align: left;\">64.8%<\/td>\n<td style=\"text-align: left;\">53.0%<\/td>\n<td style=\"text-align: left;\">33.1%<\/td>\n<td style=\"text-align: left;\">21.9%<\/td>\n<td style=\"text-align: left;\">19.3%<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: left;\">MMMLU<\/td>\n<td style=\"text-align: left;\">88.4%<\/td>\n<td style=\"text-
