<style>
/* The Local AI brand on a pan-and-zoom board: charcoal, hairlines, mono for words and labels, Geist for sentences, the dot hands edge to edge. */
:root { --ground: #101010; --bg: #161616; --surface: #1c1c1c; --line: #2e2e2e; --text: #ecEAE6; --muted: #8c8a86; --accent: #f2efe9; --red: #dc143c; --ui: Geist, system-ui, sans-serif; --display: "Instrument Serif", Georgia, serif; --dw: 400; --ds: italic; --dl: -.02em; --dsize: 38px; --dst: 100%; color-scheme: dark; }
